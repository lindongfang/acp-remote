<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>ACP Remote · PWA 原型（移动端）</title>
<script>
/* 主题：跟随系统（默认）/ 白天 / 黑夜。先于首次绘制设置，避免闪白。 */
(function(){
  try{
    var m = localStorage.getItem("acpr-proto-theme") || "system";
    var eff = (m === "system")
      ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
      : m;
    document.documentElement.setAttribute("data-theme", eff);
  }catch(e){}
})();
</script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --panel-2:#fbfbfc; --line:#e4e6eb; --line-2:#eef0f3;
    --ink:#12151a; --ink-2:#4a515c; --ink-3:#7c8593;
    --accent:#3b5bdb; --accent-ink:#2c47b8; --accent-soft:#eef2ff;
    --ok:#128a4e; --ok-soft:#e8f7ef; --warn:#a45b00; --warn-soft:#fff5e6;
    --danger:#c62828; --danger-soft:#fdecec;
    --think:#6b4eff; --think-soft:#f4f1ff; --tool:#0d7d8c; --tool-soft:#eaf7f8;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    --shadow:0 1px 2px rgba(18,21,26,.05),0 8px 24px rgba(18,21,26,.06);
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="dark"]{
      --bg:#0e1116; --panel:#151a21; --panel-2:#11151b; --line:#252c36; --line-2:#1e242c;
      --ink:#e8ecf2; --ink-2:#a8b1bd; --ink-3:#79838f;
      --accent:#8098f9; --accent-ink:#a5b4fc; --accent-soft:#1b2237;
      --ok:#4ade80; --ok-soft:#12261a; --warn:#fbbf24; --warn-soft:#2a1f0b;
      --danger:#f87171; --danger-soft:#2b1414;
      --think:#a78bfa; --think-soft:#1e1b33; --tool:#4dd0c4; --tool-soft:#0f2426;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  *{scrollbar-width:none}
  *::-webkit-scrollbar{display:none}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);
    display:flex;align-items:center;justify-content:center}
  button{font:inherit;color:inherit}
  /* 桌面上显示为手机画布 */
  .frame{width:100%;max-width:430px;height:100dvh;max-height:100dvh;background:var(--bg);
    display:flex;flex-direction:column;position:relative;overflow:hidden;container-type:inline-size}
  @media (min-width:520px){
    body{background:#eceef2}
    .frame{height:92vh;max-height:920px;border-radius:26px;box-shadow:0 18px 60px rgba(18,21,26,.18);border:1px solid #dcdfe6}
  }

  /* ---------- app bar ---------- */
  .appbar{flex:none;padding:calc(var(--sat) + 5px) 12px 5px;background:var(--panel);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:48px}
  .ab-btn{border:0;background:transparent;min-width:44px;min-height:44px;border-radius:10px;cursor:pointer;
    color:var(--accent);display:grid;place-items:center}
  .ab-btn:active{background:var(--accent-soft)}
  .ab-btn svg{width:17px;height:17px;display:block}
  .ab-btn[data-ic="orange"]{color:#d9480f}
  :root[data-theme="dark"] .ab-btn[data-ic="orange"]{color:#ffa94d}
  .ab-title{flex:1;min-width:0}
  .ab-title .t{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 详情页顶栏：目录名与会话个数同一行，用量级和胶囊拉开区别（名字粗、个数小且淡） */
  .ab-title .t .chip{font-weight:400;vertical-align:2px;margin-left:6px}
  .ab-title .s{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  /* 目录页顶栏的设备标识：连接状态也在这一个胶囊里表达（圆点给颜色，异常时补短词），点它打开主机面板 */
  .devchip{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);font:inherit;font-size:14px;cursor:pointer}
  .devchip .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .devchip .nm{font-weight:600;color:var(--ink)}
  .devchip.warn{color:var(--warn);border-color:var(--warn-soft)}
  .devchip.danger{color:var(--danger);border-color:var(--danger-soft)}
  .devchip .st{font-size:12.5px;opacity:.9}
  .devchip .caret{display:flex;align-items:center;opacity:.7}
  .devchip .caret svg{width:12px;height:12px;display:block}
  /* 新建：底色与文案颜色参考桌面端的主按钮 */
  .ab-new{background:var(--accent);border:1px solid var(--accent);color:#fff;font:inherit;font-size:13px;
    min-height:36px;padding:0 13px;border-radius:9px;cursor:pointer}
  .ab-new:active{filter:brightness(.95)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-3);display:inline-block}
  .dot.running{background:var(--ok);animation:ring 1.6s ease-out infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(18,138,78,.45)}70%{box-shadow:0 0 0 6px rgba(18,138,78,0)}100%{box-shadow:0 0 0 0 rgba(18,138,78,0)}}
  .dot.queued{background:var(--accent)}
  .dot.waiting_permission,.dot.waiting_input{background:var(--warn)}
  .dot.failed{background:var(--danger)}
  .dot.closed{opacity:.55}

  /* ---------- 通用 ---------- */
  .scroll{flex:1;overflow:auto;padding:10px 12px;padding-bottom:calc(10px + var(--sab))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
    overflow:hidden;margin-bottom:9px}
  .caret{width:13px;flex:none;color:var(--ink-3);font-size:10px;text-align:center;cursor:pointer;transition:transform .15s}
  .card.collapsed .caret{transform:rotate(-90deg)}
  .card.collapsed .dbody{display:none}
  .dhead .caret{color:var(--ink-3)}
  .dhead{display:flex;align-items:center;gap:7px;padding:7px 12px;background:var(--panel-2);
    border-bottom:1px solid var(--line)}
  .dicon{width:20px;height:20px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);
    display:grid;place-items:center;font-size:11px;flex:none}
  .dname{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .dpath{font-family:var(--mono);font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3);flex:none}
  .chip.flat{border-color:transparent;background:transparent;padding:2px 2px}
  .dbody{display:block;margin-left:14px;border-left:2px solid var(--line-2)}
  .srow{display:flex;align-items:center;gap:9px;padding:6px 12px;border-bottom:1px solid var(--line-2);
    cursor:pointer;min-height:44px}
  .srow:last-child{border-bottom:0}
  .srow:active{background:var(--panel-2)}
  .srow.on{background:var(--accent-soft)}
  .srow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
  .srow .t.noname{font-style:italic;color:var(--ink-3)}
  .srow .w{font-size:11px;color:var(--ink-3);flex:none}
  .srow .st{font-size:11.5px;color:var(--warn);flex:none;font-weight:600}
  .linkbtn{border:0;background:transparent;color:var(--accent);font-size:13.5px;cursor:pointer;
    padding:7px 5px;min-height:38px;border-radius:8px}
  .cardacts{display:flex;align-items:center;justify-content:space-between;gap:8px;
    border-top:1px solid var(--line-2);padding:1px 10px 1px 12px}
  .cardacts .linkbtn{font-size:12.5px;min-height:32px;padding:5px 4px}
  /* 目录块里的「新建」：与桌面端同一样式——淡主色底 + 主色字（不是实心主按钮） */
  .cardacts .linkbtn.add{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;
    padding:6px 12px;border-radius:9px;min-height:34px}
  .linkbtn:active{background:var(--accent-soft)}
  .btn{border:1px solid var(--line);background:var(--panel);padding:9px 15px;border-radius:10px;
    cursor:pointer;min-height:42px;font-weight:600}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.stop{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn[disabled]{opacity:.5}
  .btn.block{display:block;width:100%}
  .blank{text-align:center;padding:38px 20px;color:var(--ink-3)}
  .blank h2{color:var(--ink);font-size:17px;margin:0 0 8px}
  .search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;height:34px;padding:0 10px;margin-bottom:6px}
  .search input{flex:1;border:0;outline:0;background:transparent;font:inherit;color:var(--ink)}
  .segbar{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);margin-bottom:8px}
  .segbar button{flex:1;border:0;background:transparent;padding:9px 0;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
  .segbar button+button{border-left:1px solid var(--line)}
  .segbar button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .notice{border-radius:10px;padding:11px 13px;font-size:13px;display:flex;gap:9px;align-items:flex-start;margin-bottom:10px}
  .notice.warn{background:var(--warn-soft);color:var(--warn)}
  .notice.info{background:var(--accent-soft);color:var(--accent-ink)}
  .connstrip{flex:none;display:flex;align-items:center;gap:9px;padding:6px 13px;background:var(--accent-soft);
    color:var(--accent-ink);font-size:12.5px;border-bottom:1px solid var(--line)}
  .connstrip.warn{background:var(--warn-soft);color:var(--warn)}
  .connstrip.danger{background:var(--danger-soft);color:var(--danger)}
  .spin{width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;
    display:inline-block;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- 对话 ---------- */
  .tabbar{flex:none;display:flex;gap:0;border-top:1px solid var(--line);background:var(--panel)}
  .tabbar button{flex:1;border:0;background:transparent;padding:8px 0;cursor:pointer;font-size:13px;
    color:var(--ink-3);min-height:42px;display:flex;align-items:center;justify-content:center;gap:7px}
  .tabbar button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 -2px 0 var(--accent)}
  .tabbar.file-tabbar{padding-bottom:var(--sab)}
  .composer{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:6px 12px calc(6px + var(--sab))}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .chip-pick{flex:none;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;
    padding:5px 11px;font-size:12.5px;color:var(--ink-2);cursor:pointer;min-height:32px}
  .chips .chip-pick{font-size:12px;padding:4px 10px;min-height:28px}
  /* 选中态用底色区分（不用勾） */
  .chip-pick.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .chip-pick b{color:var(--ink)}
  .chip-ctx{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
    background:var(--panel-2);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--ink-2);min-height:32px}
  .chip-ctx .bar{width:52px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
  .chip-ctx .bar i{display:block;height:100%;background:var(--ok)}
  .chip-ctx.warn .bar i{background:var(--warn)} .chip-ctx.crit .bar i{background:var(--danger)}
  .chip-ctx.warn{border-color:var(--warn)} .chip-ctx.crit{border-color:var(--danger);background:var(--danger-soft)}
  .inputrow{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);border-radius:14px;
    padding:8px 10px;background:var(--panel-2)}
  .inputrow textarea{flex:1;border:0;outline:0;background:transparent;font:inherit;color:var(--ink);
    resize:none;min-height:34px;max-height:104px;line-height:1.45}
  .hintrow{font-size:11px;color:var(--ink-3);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
  .msg-user{max-width:84%;margin-left:auto;background:var(--accent-soft);border-radius:14px;
    padding:9px 12px;margin-top:10px;word-break:break-word}
  .msg-agent{margin-top:12px}
  .msg-agent .bubble{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:12px 13px;word-break:break-word}
  .who{font-size:11px;color:var(--ink-3);margin:0 2px 5px}
  .msg-user .who{text-align:right}
  .tstamp{font-size:11px;color:var(--ink-3);margin-top:4px}
  .msg-user+.tstamp{text-align:right}
  .fold{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;
    background:var(--panel);overflow:hidden;margin-top:6px}
  .fold.think{border-left-color:var(--think);background:var(--think-soft)}
  .fold.tool{border-left-color:var(--tool);background:var(--tool-soft)}
  .fold.perm{border-left-color:var(--warn);background:var(--warn-soft)}
  .fold.think .kind{color:var(--think)} .fold.tool .kind{color:var(--tool)} .fold.perm .kind{color:var(--warn)}
  .fold .fh{background:transparent;display:flex;align-items:center;gap:9px;padding:8px 11px;cursor:pointer;
    font-size:13px;color:var(--ink-2);min-height:40px}
  .fold .caret{width:12px;flex:none}
  .fold.open .caret{transform:rotate(90deg)}
  .fold .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fold .ttl.mono{font-family:var(--mono);font-size:11.5px}
  .fold .st{font-size:11.5px;color:var(--ink-3);flex:none}
  .fold .st.ok{color:var(--ok)} .fold .st.run{color:var(--accent)}
  .fold .fb{padding:9px 11px;border-top:1px solid var(--line-2);font-size:13px;color:var(--ink-2);
    white-space:pre-wrap;background:var(--panel)}
  .fold:not(.open) .fb{display:none}
  .fold .fb.dim{color:var(--ink-3);font-style:italic}
  .fb .kv{display:grid;grid-template-columns:70px 1fr;gap:5px 12px;margin:0 0 10px;font-size:12.5px}
  .fb .kv dt{color:var(--ink-3)} .fb .kv dd{margin:0;font-family:var(--mono);font-size:11.5px;word-break:break-all}
  .fb .prev{border:1px solid var(--line);border-radius:8px;overflow:auto;font-family:var(--mono);
    font-size:11px;margin:0 0 9px}
  .fb .prev div{padding:1px 8px;white-space:pre}
  .fb .prev .add{background:var(--ok-soft);color:var(--ok)}
  .fb .prev .del{background:var(--danger-soft);color:var(--danger)}
  .fb .prev .ctx{color:var(--ink-3)}
  .fb .out{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px;
    font-family:var(--mono);font-size:11px;margin:0 0 9px;white-space:pre;overflow:auto}
  .code{margin-top:8px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;
    overflow:hidden;background:var(--panel)}
  .code .ch{display:flex;align-items:center;gap:8px;padding:7px 11px;background:var(--accent-soft);
    border-bottom:1px solid var(--line-2);font-size:11.5px;color:var(--accent-ink)}
  .code pre{margin:0;padding:9px 0;font-family:var(--mono);font-size:11px;line-height:1.6;overflow:auto}
  .code pre div{display:flex;padding:0 10px}
  .code pre .ln{width:24px;flex:none;text-align:right;color:var(--ink-3)}
  .code pre .tx{white-space:pre}
  .code .ln-add{background:var(--ok-soft)} .code .ln-del{background:var(--danger-soft)}
  .s-kw{color:var(--accent-ink);font-weight:600} .s-str{color:var(--ok)} .s-num{color:var(--warn)}
  .s-com{color:var(--ink-3);font-style:italic} .s-dec{color:var(--think)}
  .md>:first-child{margin-top:0} .md>:last-child{margin-bottom:0}
  .md p{margin:0 0 7px;white-space:pre-wrap}
  .md h1{font-size:17px;margin:11px 0 5px} .md h2{font-size:16px;margin:11px 0 5px} .md h3{font-size:15px;margin:9px 0 4px}
  .md ul,.md ol{margin:0 0 7px;padding-left:20px} .md li{margin:2px 0}
  .md blockquote{margin:0 0 9px;padding:8px 12px;border-left:3px solid var(--line);
    background:var(--panel-2);border-radius:0 8px 8px 0;color:var(--ink-2)}
  .md code{font-family:var(--mono);font-size:.9em;background:var(--panel-2);border:1px solid var(--line);
    border-radius:5px;padding:1px 5px}
  .md table{border-collapse:collapse;margin:0 0 8px;font-size:12.5px;width:100%}
  .md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left}
  .md th{background:var(--panel-2);font-weight:600}
  .md a{color:var(--accent)}
  .md .imgblk{color:var(--ink-3);font-style:italic;font-size:12.5px}
  .md .badlink{color:var(--danger);text-decoration:line-through}
  .perm{border:1px solid var(--warn);border-left:3px solid var(--warn);background:var(--warn-soft);
    border-radius:12px;padding:11px;margin-top:6px}
  .perm .ptitle{font-weight:600;font-size:14px;margin-bottom:6px}
  .perm .pdesc{font-family:var(--mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line);
    border-radius:7px;padding:8px;margin:8px 0 11px;white-space:pre-wrap}
  .perm .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .perm .opts .btn{font-weight:600;color:#fff;border-color:transparent}
  .perm .opts .btn:first-child{grid-column:1 / -1}
  /* 三个动作底色区分：允许一次=蓝 / 始终允许=琥珀 / 拒绝=红 */
  .perm .opts .btn.p-once{background:var(--accent)}
  .perm .opts .btn.p-always{background:var(--warn)}
  .perm .opts .btn.p-reject{background:var(--danger)}
  .perm .opts .btn:active{filter:brightness(.94)}
  .deg{border:1px dashed var(--line);border-left:3px solid var(--ink-3);background:var(--panel-2);
    border-radius:10px;padding:10px 11px;margin-top:6px}
  .deg.warn{border-left-color:var(--warn);border-color:var(--warn-soft)}
  .deg .dh{font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center}
  .deg .det{margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}
  .deg .det .mono{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .streamfail{color:var(--danger);background:var(--danger-soft);border-left:3px solid var(--danger);
    border-radius:9px;padding:10px 12px;font-size:13px;margin-top:8px}
  .live{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ok);
    border:1px solid var(--ok);background:var(--ok-soft);border-radius:999px;padding:5px 12px;margin-top:10px}
  .jumppill{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:none;align-items:center;
    gap:8px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:999px;
    padding:10px 16px;font-size:13px;color:var(--ink-2);z-index:9;min-height:44px}
  .jumppill b{color:var(--accent)}
  .diff{border:1px solid var(--line);border-radius:8px;overflow:auto;background:var(--panel);
    font-family:var(--mono);font-size:11px}
  .diff div{padding:1px 9px;white-space:pre}
  .diff .d-del{background:var(--danger-soft);color:var(--danger)}
  .diff .d-add{background:var(--ok-soft);color:var(--ok)}
  .diff .d-ctx{color:var(--ink-3)}
  .diff .d-hd{background:var(--panel-2);color:var(--ink-3);font-size:10.5px;padding:4px 9px}

  /* ---------- 文件 ---------- */
  .filetab{flex:1;min-height:0;display:flex;flex-direction:column}
  .file-controls{flex:none;padding:10px 12px 0;background:var(--bg)}
  .file-controls .segbar{margin-bottom:8px}
  .file-subbar{display:flex;align-items:center;gap:8px;min-height:36px;margin-bottom:8px}
  .fpath{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:var(--mono);font-size:12px;color:var(--ink-3)}
  .frefresh{width:36px;height:36px;flex:none;display:grid;place-items:center;border:1px solid var(--line);
    border-radius:9px;background:var(--panel);color:var(--ink-2)}
  .frefresh svg{width:16px;height:16px}
  .fvsource{flex:none;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;
    background:var(--line-2);color:var(--ink-2)}
  .fvsource.git{background:var(--warn-soft);color:var(--warn)}
  .fclose{flex:none;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink-2);
    font:inherit;font-size:12px;padding:7px 11px;min-height:36px}
  .fclose:active{background:var(--accent-soft);color:var(--accent-ink)}
  .ftoolbar{display:flex;align-items:center;gap:8px;min-height:34px;padding:0 2px 8px}
  .fswitch{display:inline-flex;align-items:center;gap:9px;border:0;background:transparent;
    color:var(--ink-2);font:inherit;font-size:13px;cursor:pointer;padding:6px 0;min-height:34px}
  .fswitch .track{width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;
    flex:none;transition:background .12s}
  .fswitch .knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .12s}
  .fswitch.on .track{background:var(--accent)}
  .fswitch.on .knob{transform:translateX(12px)}
  .flegend{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
  .flegend b{font-weight:500;color:var(--ink-2)}
  .fdot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink-3)}
  .fdot.pos{background:var(--ok)} .fdot.neg{background:var(--danger)}
  .file-scroll{flex:1;min-height:0;overflow:auto;background:var(--bg);padding:0 0 calc(10px + var(--sab))}
  .ftree{display:flex;flex-direction:column}
  .ftreeChildren{margin-left:22px;padding-left:2px;border-left:1px solid var(--line-2)}
  .fdir{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;cursor:pointer;
    font-size:14px;font-weight:500;color:var(--ink-2)}
  .fdir:active{background:var(--line-2)}
  .fdir.open{color:var(--ink)}
  .frow{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;
    font-size:14px;color:var(--ink);cursor:pointer}
  .frow:active{background:var(--line-2)}
  .frow.on{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
  .frow.on .fname{font-weight:600}
  .ficon{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;
    border-radius:7px;background:var(--line-2);color:var(--ink-3)}
  .ficon.f-dir{background:var(--accent-soft);color:var(--accent-ink)}
  .ficon.f-code{background:var(--tool-soft);color:var(--tool)}
  .ficon.f-doc{background:var(--line-2);color:var(--ink-2)}
  .ficon.f-config{background:var(--warn-soft);color:var(--warn)}
  .ficon.f-image{background:var(--think-soft);color:var(--think)}
  .ficon svg{width:18px;height:18px;display:block}
  .fcount{margin-left:auto;flex:none;min-width:20px;text-align:right;font-family:var(--mono);
    font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-3)}
  .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
  .fname.pos{color:var(--ok)} .fname.neg{color:var(--danger)}
  .fmeta{display:flex;align-items:center;gap:5px;flex:none;font-size:12px;color:var(--ink-3)}
  .fstat{height:18px;display:inline-flex;align-items:center;padding:0 6px;border-radius:5px;
    font-family:var(--mono);font-size:11.5px;line-height:1;font-variant-numeric:tabular-nums}
  .fstat.add{background:var(--ok-soft);color:var(--ok)}
  .fstat.del{background:var(--danger-soft);color:var(--danger)}
  .fchip{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--line-2);color:var(--ink-2)}

  /* 移动端的只读文件查看区 */
  .file-viewer{flex:1;min-height:0;overflow:auto;padding:12px 12px calc(20px + var(--sab));background:var(--bg)}
  .fvmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-bottom:8px}
  .mcode{display:flex;border:1px solid var(--line);border-radius:10px;overflow:auto;background:var(--panel)}
  .fvln{flex:none;position:sticky;left:0;z-index:1;min-width:3.4em;padding:12px 8px 12px 12px;
    text-align:right;color:var(--ink-3);font-family:var(--mono);font-size:11.5px;line-height:1.65;
    background:var(--panel-2);white-space:pre;font-variant-numeric:tabular-nums;
    border-right:1px solid var(--line-2);user-select:none}
  .fvtext{margin:0;padding:12px 12px;background:var(--panel);color:var(--ink);
    font-family:var(--mono);font-size:12px;line-height:1.65;white-space:pre;tab-size:2;
    overflow:visible;min-width:0}
  .file-viewer .diff{font-size:12px;line-height:1.65}
  .file-viewer .diff div{padding:2px 10px}
  .file-viewer .diff .d-hd{font-size:11.5px;padding:4px 10px}
  .fvempty{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px;
    border:1px dashed var(--line);border-radius:10px;color:var(--ink-3);font-size:12.5px}
  .fvempty b{color:var(--ink-2);font-weight:600}

  /* 容器查询：按画布宽度而非视口判断，桌面预览手机时同样生效 */
  @container (max-width:520px){ .kbdhint{display:none} }

  /* ---------- 底部 sheet（全屏） ---------- */
  .scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);opacity:0;pointer-events:none;
    transition:.2s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;top:8%;background:var(--panel);border-radius:16px 16px 0 0;
    z-index:41;display:flex;flex-direction:column;transform:translateY(101%);transition:transform .22s ease;
    max-width:430px;margin:0 auto;box-shadow:0 -12px 40px rgba(0,0,0,.2)}
  @media (min-width:520px){ .sheet{max-width:430px} }
  .sheet.open{transform:none}
  .grab{width:36px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
  .sheethead{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px 12px;border-bottom:1px solid var(--line)}
  .sheethead .t{font-weight:600;flex:1}
  .sheetbody{flex:1;overflow:auto;padding:14px 14px calc(16px + var(--sab))}
  .kvrow{display:flex;gap:12px;font-size:13px;margin:7px 0}
  .kvrow .k{color:var(--ink-3);width:70px;flex:none}
  .kvrow .v{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;word-break:break-all}
  .dxsec{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;overflow:hidden}
  .dxsec>.sh{display:flex;align-items:center;gap:9px;padding:11px 12px;background:var(--panel-2);
    cursor:pointer;font-size:13px;font-weight:600;min-height:44px}
  .dxsec>.sh .car{width:11px;color:var(--ink-3);flex:none}
  .dxsec.open>.sh .car{transform:rotate(90deg)}
  .dxsec>.sh .lg{font-weight:400;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
  .dxsec pre{margin:0;padding:11px 12px;font-family:var(--mono);font-size:11px;line-height:1.6;
    white-space:pre-wrap;word-break:break-word;overflow:auto;max-height:280px;border-top:1px solid var(--line-2)}
  .dxsec .meta{padding:7px 12px;border-top:1px solid var(--line-2);font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
  .dxnote{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin:0;border-left:3px solid var(--warn);
    background:var(--warn-soft);border-radius:8px;padding:10px 12px}
  .dxavail{border-left:3px solid var(--danger);background:var(--danger-soft);border-radius:8px;padding:11px;
    font-size:12.5px;color:var(--danger)}
  .hblock{margin:0 0 14px;border:1px solid var(--danger);background:var(--danger-soft);border-radius:11px;
    padding:13px;color:var(--danger)}
  .hblock .t{font-weight:600;font-size:14px;margin-bottom:6px}
  .hblock .d{font-size:12.5px;line-height:1.6}
  .hsec{padding:12px 0;border-bottom:1px solid var(--line-2)}
  .hsec h5{margin:0 0 8px;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.05em}
  .hnote{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin:8px 0 0}
  .hconfirm{margin:12px 0 0;border:1px solid var(--danger);background:var(--danger-soft);border-radius:11px;
    padding:12px;color:var(--danger);font-size:12.5px;line-height:1.6}
  .agentopt{display:flex;gap:10px;align-items:flex-start;padding:13px;border:1px solid var(--line);
    border-radius:10px;cursor:pointer;margin-bottom:8px;min-height:56px}
  .agentopt.on{border-color:var(--accent);background:var(--accent-soft)}
  .radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none;margin-top:3px}
  .agentopt.on .radio{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--panel)}
  .errbox{color:var(--danger);background:var(--danger-soft);border-radius:9px;padding:11px;font-size:12.5px;
    margin-top:12px;line-height:1.6}

  /* ---------- 配对 ---------- */
  .pairbody{flex:1;overflow:auto;padding:24px 18px calc(24px + var(--sab));display:flex;flex-direction:column;
    justify-content:center;text-align:center}
  .pair h1{font-size:21px;line-height:1.3;margin:0 0 8px}
  .pair h2{font-size:15px;margin:0 0 10px}
  .lede{margin:0 auto 14px;color:var(--ink-2);max-width:30ch}
  .pairring{position:relative;width:94px;height:94px;margin:0 auto 20px}
  .pairring::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--line);
    border-top-color:var(--accent);animation:spin 1s linear infinite}
  .ringcount{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:19px;color:var(--ink);letter-spacing:.03em;line-height:1.1}
  .paircard{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel);margin:18px auto 0;
    max-width:340px;text-align:left}
  /* 配对码输入：8 格保持在一行（宽度自适应，字号/间距随屏宽收缩）；输入态只显示静态有效期提示，lookup 后才出现倒计时 */
  .pairpanel{width:100%;max-width:360px;box-sizing:border-box;margin:0 auto;padding:22px 18px 18px;
    border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow);text-align:center}
  .pairpanel h1{font-size:21px;margin:0 0 4px}
  .pairorigin{display:inline-flex;align-items:center;gap:7px;max-width:100%;margin:0 0 16px;padding:6px 11px;
    border-radius:999px;background:var(--panel-2);border:1px solid var(--line-2);font-size:11.5px;color:var(--ink-2)}
  .pairorigin .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  .pairorigin .host{font-family:var(--mono);font-size:11px;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .pairorigin .tls{flex:none;font-size:9px;font-weight:700;letter-spacing:.05em;color:var(--ok);
    background:var(--ok-soft);border-radius:4px;padding:2px 5px}
  .pairhint{margin:0 auto 16px;max-width:26ch;font-size:11.5px;line-height:1.6;color:var(--ink-3)}
  .codes{display:flex;gap:clamp(4px,1.7vw,8px);max-width:100%;margin:0 auto}
  .codes input{flex:1 1 0;min-width:0;width:auto;height:52px;box-sizing:border-box;padding:0;text-align:center;
    border-radius:11px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    font:600 clamp(16px,5vw,21px)/1 var(--mono);outline:0;transition:border-color .12s,box-shadow .12s}
  .codes input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .paira{display:flex;justify-content:center;margin-top:18px}
  .paira .btn{width:100%;padding:12px 20px;font-size:14px;border-radius:11px}
  .kvbox{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 18px;background:var(--panel)}
  .glyph{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;
    background:var(--warn-soft);color:var(--warn);margin:0 auto 18px}
  .glyph.danger{background:var(--danger-soft);color:var(--danger)}
  .olsteps{margin:0;padding-left:20px;font-size:13.5px;color:var(--ink-2)}
  .olsteps li{margin:3px 0}
  .hint{font-size:12.5px;color:var(--ink-3);line-height:1.6}
  .field{margin-bottom:14px}
  .field>label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field input{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--ink);font:inherit;outline:0}
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .field .hint{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.55}
  .dpath{font-family:var(--mono);font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;max-width:88px;flex:none}
  /* 新建会话弹层里的目录信息：目录 / 路径 两行（标签淡、值醒目；路径用等宽字体） */
  .dirinfo{margin-bottom:14px;display:flex;flex-direction:column;gap:7px}
  .drow{display:flex;align-items:baseline;gap:10px;min-width:0}
  .dk{flex:none;min-width:34px;font-size:12px;color:var(--ink-3);letter-spacing:.02em}
  .dv{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:600;color:var(--ink)}
  .dv.mono{font-family:var(--mono);font-size:13.5px;font-weight:500;color:var(--ink)}
  .dirinfo .hint{margin-top:2px}
  /* 详情页的路径：与新建弹层的「路径」同一套（淡标签 + 等宽值），不再是塞在副标题里的灰小字 */
  /* 与下面的月份分段条之间留出间距，否则「路径」那行会贴着「全部」 */
  .pathline{padding:12px 14px 0;margin-bottom:12px}
  .pathline .dirinfo{margin-bottom:0}
  .drow .dpath{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:var(--mono);font-size:13.5px;font-weight:500;color:var(--ink)}
  /* 「选择文件夹」控件（仿浏览器 <input type="file" webkitdirectory>）：按钮 + 右侧的选择结果 */
  .filec{display:flex;align-items:center;gap:10px;min-width:0}
  .filecbtn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:inherit;font-size:13.5px;
    min-height:44px;padding:0 14px;border-radius:8px;cursor:pointer;flex:none}
  .filecval{font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filecval.ph{font-weight:400;color:var(--ink-3)}
  .diropt{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:10px;border:0;border-radius:9px;
    background:transparent;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
  .diropt:active{background:var(--accent-soft)}
  .diropt.on{background:var(--accent-soft)}
  .diropt .dn{font-weight:600}
  .diropt .da{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .diropt.other .da{font-family:inherit;font-size:12px;white-space:normal}
  /* 选择文件夹的弹窗：浏览远端节点上的目录看（面包屑 + 子目录 + 新建文件夹），不是让用户手输路径 */
  .dirpick{position:fixed;inset:0;background:rgba(10,12,16,.5);display:none;align-items:center;
    justify-content:center;z-index:66;padding:16px}
  .dirpick.open{display:flex}
  .dpbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:400px;
    max-height:84vh;display:flex;flex-direction:column;overflow:hidden}
  .dphead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600}
  .dphead .btn{margin-left:auto}
  .dpwhere{font-weight:400;font-size:11.5px;color:var(--ink-3)}
  .dpbody{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
  .dpcrumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px}
  .dpcrumb button{border:0;background:transparent;color:var(--accent);font:inherit;cursor:pointer;
    padding:4px 5px;border-radius:5px}
  .dpcrumb .sep{color:var(--ink-3)}
  .dpup{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:8px;
    padding:6px 10px;font-size:12.5px;cursor:pointer;font-family:var(--sans);min-height:36px}
  .dplist{display:flex;flex-direction:column;gap:2px}
  .dpempty{padding:14px 4px;color:var(--ink-3);font-size:12.5px}
  .dpnew{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .dpnew input{flex:1;min-width:120px;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink);font:inherit;outline:0}
  .dpnew input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .diropt .ch{color:var(--ink-3);flex:none}
  .dpfoot{padding:12px 14px;border-top:1px solid var(--line)}
  /* 详情页：按时间的一页列表 + 翻页条（不再按月分组/筛选，也没有表头） */
  .pagerbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 4px;
    border-top:1px solid var(--line-2);margin-top:10px}
  .pagerbar .btn{min-height:40px}
  .pagerbar .pinfo{font-size:11.5px;color:var(--ink-3);text-align:center;line-height:1.5;display:flex;align-items:center;gap:6px}
  .pageinput{width:38px;text-align:center;padding:5px 6px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink);font:inherit;font-size:12.5px;outline:0}
  .pageinput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .endline{text-align:center;color:var(--ink-3);font-size:12px;padding:14px 0 2px}
  .dpcur{display:block;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-bottom:8px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- 控制台 ---------- */
  .console{position:fixed;left:8px;right:8px;bottom:8px;max-width:414px;margin:0 auto;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:60;font-size:12px}
  .console>header{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-weight:600;
    border-bottom:1px solid var(--line-2)}
  .console .body{padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow:auto}
  .console.collapsed .body{display:none}
  .console label{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
  .console select{flex:1;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
  .console .row{display:flex;gap:6px;flex-wrap:wrap}
  .console .row button{flex:1;min-width:62px;padding:7px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel-2);cursor:pointer;font-size:11.5px}
  .console .row button.cur{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:600}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);background:var(--ink);
    color:var(--bg);padding:9px 15px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
    transition:.2s;z-index:70;max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="frame" id="frame"></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sheethead"><span class="t" id="sheetTitle">详情</span>
    <button class="btn" id="sheetClose">关闭</button></div>
  <div class="sheetbody" id="sheetBody"></div>
