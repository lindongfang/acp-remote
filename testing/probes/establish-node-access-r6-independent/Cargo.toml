[package]
name = "independent-r6-acceptance"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
acp-remote = { path = "../../../app" }
tokio = { version = "1.53.3", features = ["full"] }
serde_json = "1.0.154"
p256 = { version = "0.14.0", features = ["ecdsa"] }
base64 = "0.22.1"
rcgen = "0.14.7"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
