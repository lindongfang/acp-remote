# Dependabot 配置：依赖更新的唯一配置点。
#
# 为什么需要它：`docs/SECURITY_DESIGN.md` §16.2 要求「安全修复可以定位受影响版本」，而本仓库的
# 依赖是锁定的（`Cargo.lock`、`package-lock.json` 入库）。锁定本身不产生更新——没有这项配置时，
# 上游发布安全修复只能靠人想起去看，等于把供应链响应依赖在记忆上。
#
# 与提交规范的关系：Dependabot 生成的提交信息必须能过 `commitlint.config.mjs` 的词表，
# 所以每个 ecosystem 都显式配置 `commit-message.prefix`：
#   - `build(deps):` → `build` 在 TYPES 里、`deps` 在 SCOPES 里；
#   - `ci:` → `ci` 在 TYPES 里（scope 可选）。
# 刻意**不使用** `include: scope`：它会把被更新的依赖名列表填进 scope，产生
# `build(serde, tokio): ...` 这类不在 SCOPES 里的 scope，直接让 `commits` job 失败。
#
# `cooldown` 的作用是避免第一时间采用刚发布的版本：发布者账号被盗后植入恶意版本，
# 通常在被发现与撤回前的这段窗口里传播，冷却期让这段时间过去再考虑升版。
# 冷却期不改变「升级仍要过 CI」这件事——`checks` / `deps` / `advisories` 三个 job 照常判定。

version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      # minor 与 patch 合并成一个 PR：这类升级的审阅重点相近，分开提会淹没 PR 列表。
      # major 升级刻意不分组——它需要逐个读 changelog 与迁移说明。
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
    # `@fission-ai/openspec` 在 `package.json` 里是精确 pin，且必须与 `@dongfanglin/openspec-agentic`
    # 声明的 peer 版本（`0.4.0` → `1.13.0`）完全一致：`npm ci` 会因 peer 冲突直接 ERESOLVE，
    # 而 `npm run check:agentic` 的 `openspec-agentic doctor` 也会断言「项目本地引擎版本 == 扩展 pin 的
    # 版本」。引擎升级的路径是 `openspec-agentic update`（连同扩展一起升并刷新受管文件哈希），
    # 不是 Dependabot 单独升这一项；不忽略它会每周复现同一个必失败的 PR（#32）。
    ignore:
      - dependency-name: "@fission-ai/openspec"
    groups:
      # 这些包只用于合同校验脚本与提交钩子（见 package.json 的 description），
      # 它们的升级会影响门禁本身的行为，因此仍需过全部 CI。
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # `clients/app` 是**独立的 npm 工程**（自带 `package.json` 与 `package-lock.json`），
  # 根条目 `directory: "/"` 不覆盖它。此前没有这条声明时，Dependabot 仍会为该 manifest
  # 生成更新，但走的是**默认配置**：标题会写成 `... in /clients/app`，其中 `/clients/app`
  # 被 `commitlint` 当成 scope，而 scope 是「模块与交付面边界」、路径不在词表里，因此
  # `commits` job 必失败（#49–#53）。显式声明后即可带上与根条目一致的 `commit-message.prefix`，
  # 标题不再含路径，同时沿用同一套冷却期与分组策略。
  #
  # 注意前端工程的验证面：`clients/app` 的 `tsc` / `vitest` / Chromium / `e2e` **不在**
  # CI 的五个必需检查内（它们只跑仓库根的门禁），因此这里的升级即使 CI 全绿，
  # 合并前仍须在本地跑一遍 `clients/app` 的四道验证。
  - package-ecosystem: npm
    directory: "/clients/app"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      # 与根条目同理：minor/patch 合并成一个 PR；major 不分组，需逐个读迁移说明。
      # expo / react-native 的主版本升级会动构建配置，尤其需要单独审阅。
      clients-app-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
    groups:
      # action 的 major 升级在本仓库是**受约束的变化**：`.github/workflows/ci.yml` 里的
      # 第三方 action 按 commit SHA 固定，官方 action 固定到 major。Dependabot 只会改注释里的
      # 版本号而不会把官方 action 换成 SHA，也不会替我们核对 ADR-0008 的许可证与数据外流约束，
      # 因此这类 PR 必须人工读 diff 后再合。
      github-actions:
        patterns: ["*"]
