# CI：把 `AGENTS.md` §8/§10 要求的所有检查变成"每次都跑"。
#
# 判据来源（不要在别处再写一份）：
# - `npm run check` 串行跑 `scripts/` 下八个门禁（协议 fixture、命令目录与 core 的 grant 镜像、错误码、
#   feature 词表、需要真正计算的资产绑定、ACP 矩阵、crate 依赖方向、合同漂移）；
# - `AGENTS.md` §8 的三条 cargo 命令（fmt / clippy -D warnings / test）。
#
# 供应链约束（`docs/SECURITY_DESIGN.md` §16.2「CI 使用固定 action/toolchain major 或 digest」）：
# - 只用 GitHub 官方 action 且固定 major（`actions/checkout@v4` 等）；Rust 工具链用 runner 自带的
#   rustup 直接安装固定版本，不引入第三方 toolchain action；
# - 两个依赖锁定文件都已入库，因此 `npm ci` 与 `cargo --locked` 都能阻止依赖漂移；
# - 发布 job 不在本文件里：§16.2 要求发布与普通 CI 分离、单独走受保护 tag 与 OIDC。

name: CI

on:
  push:
  pull_request:

# 同一分支的新提交取消上一次未完成的运行。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  checks:
    name: 合同门禁 + Rust 检查
    runs-on: ubuntu-latest
    # Linux runner 会真正执行 `#[cfg(unix)]` 的路径（`0700` 目录、`0600` 文件、模式位判定与
    # `tests/permissions.rs` 的两个用例）——这些在 Windows 开发机上永远不会跑到，是 CI 的主要收益。
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: 安装合同校验脚本的依赖
        run: npm ci

      - name: 合同门禁（npm run check，八个脚本）
        run: npm run check

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: 静态检查
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: 测试
        run: cargo test --locked --workspace --all-features
