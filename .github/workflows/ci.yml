# CI：把 `AGENTS.md` §8/§10 要求的所有检查变成"每次都跑"。
#
# 判据来源（不要在别处再写一份）：
# - `npm run check` 串行跑九个门禁（协议 fixture、命令目录与 core 的 grant 镜像、错误码、
#   feature 词表、需要真正计算的资产绑定、ACP 矩阵、crate 依赖方向、合同漂移、agentic 流程与规范校验）；
# - `AGENTS.md` §8 的三条 cargo 命令（fmt / clippy -D warnings / test）与提交信息规范
#   （`commits` job，词表见 `commitlint.config.mjs`）。
#
# 供应链约束（`docs/SECURITY_DESIGN.md` §16.2「CI 使用固定 action/toolchain major 或 digest」）：
# - 只用 GitHub 官方 action 且固定 major（`actions/checkout@v4` 等）；Rust 工具链用 runner 自带的
#   rustup 直接安装固定版本，不引入第三方 toolchain action；
# - 两个依赖锁定文件都已入库，因此 `npm ci` 与 `cargo --locked` 都能阻止依赖漂移；
# - 发布 job 不在本文件里：§16.2 要求发布与普通 CI 分离、单独走受保护 tag 与 OIDC。

name: CI

on:
  push:
  pull_request:

# 同一分支的新提交取消上一次未完成的运行。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  checks:
    name: 合同门禁 + Rust 检查
    runs-on: ubuntu-latest
    # Linux runner 会真正执行 `#[cfg(unix)]` 的路径（`0700` 目录、`0600` 文件、模式位判定与
    # `tests/permissions.rs` 的两个用例）——这些在 Windows 开发机上永远不会跑到，是 CI 的主要收益。
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: 安装合同校验脚本的依赖
        run: npm ci

      - name: 合同门禁（npm run check，九个门禁）
        run: npm run check

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: 静态检查
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: 测试
        run: cargo test --locked --workspace --all-features

  commits:
    name: 提交信息规范
    runs-on: ubuntu-latest
    # 提交信息只校验“本次推送或合并请求引入的那段范围”：仓库早期提交不是 Conventional Commits，
    # 校验全历史会立刻失败。本地钩子（`.husky/commit-msg`）能被 `--no-verify` 绕过，这一步是硬门禁。
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint 用 `--from/--to` 比对本地范围，因此两个端点都必须已经取下来。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验提交信息（Conventional Commits，词表见 commitlint.config.mjs）
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "没有可比对的基线提交（新分支或首次推送），跳过范围校验。"
            exit 0
          fi
          if ! git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null; then
            echo "基线提交 $BASE_SHA 不在本地历史中（强推或浅克隆），跳过范围校验。"
            exit 0
          fi
          npm run lint:commits -- --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
