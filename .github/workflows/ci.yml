name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  product:
    name: 节点接入构建与检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            clients/web/package-lock.json
      - name: 读取 Rust 工具链
        run: rustup show active-toolchain
      - run: npm ci
      - run: npm ci --prefix clients/web
      - name: Rust 与 Web 格式、静态、测试和构建
        run: npm run check
      - name: 开发与 Web 依赖审计
        run: |
          npm audit --audit-level=high
          npm --prefix clients/web audit --audit-level=high
  checks:
    name: 开发工具安装与依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 开发工具依赖审计
        run: npm audit --audit-level=high
  secrets:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
  commits:
    name: 提交信息规范
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 校验当前提交范围
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "无可比对基线，跳过提交范围校验。"
            exit 0
          fi
          if ! git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null; then
            echo "基线不在本地历史中，跳过范围校验。"
            exit 0
          fi
          npm run lint:commits -- --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
