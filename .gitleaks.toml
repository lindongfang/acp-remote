# gitleaks 配置：提交进仓库的密钥材料扫描。
#
# 判据来源：`AGENTS.md` §4「私钥和 token 不得写入日志、协议错误、测试快照或普通 SQLite 字段」，
# 以及 `docs/SECURITY_DESIGN.md` §16.2 的供应链要求；执行者是 CI 的 `secrets` job
# （`gitleaks/gitleaks-action`，按 commit 固定，见 `docs/adr/0008-ci-supply-chain-tooling.md`）。
#
# 这里刻意只做一件事：声明使用 gitleaks 的默认规则集。
# `[extend] useDefault = true` 是所有规则的来源，不在这里复制一份正则——复制出来的规则会与上游
# 默认集漂移，而且会让「为什么漏检」变得无法追溯。
[extend]
useDefault = true

# 关于允许清单（allowlist）的政策，写在这里以免下一个人以为「加一条 allowlist」是随手动作：
#
# 1. 允许清单只用于**公开的固定测试向量**（例如 `fixtures/*/v1/transcripts/` 里按
#    `compatibility/transcripts/v1/transcripts.json` 重算过的密钥材料），或明确记录了假阳性的具体路径。
# 2. 每一条都必须写 `description`：这是什么、为什么不是真实凭据、谁核对过。
#    拒绝整目录放行，也拒绝用正则放宽全局规则。
# 3. 真实凭据被扫描到时的正确处置是**轮换凭据 + 清理历史 + 记录事件响应**
#    （`SECURITY_DESIGN.md` §17），不是加允许清单。
# 4. 现有条目逐条登记在文件末尾的 `[[allowlists]]`。写这份配置时仓库还没有固定向量需要豁免
#    （`check:assets` 重算的向量里只有公钥、nonce 与签名，没有私钥）；证据来源是 CI 每日 `schedule`
#    的**全历史**扫描——它一旦命中 `fixtures/**` 或文档示例，先确认命中项确实是公开测试向量或
#    明确的假阳性，再按第 1、2 条加最小范围的条目，并在同一次改动里登记到下面。
#    注意 push / pull_request 只扫**本次范围**，因此这类历史命中在 PR 上一直是绿的，只有在全历史
#    扫描里才会暴露；改动允许清单后要等下一次 `schedule` 才能端到端确认。

# 自研 keystore 条目的**明文**形态（`identity-keystore`，`docs/MODULE_ARCHITECTURE.md` §4.12）。
#
# 为什么需要这条规则：条目格式是自研的（magic `ACPK` + 版本 + 用途 + 标签 + 32 字节盐 +
# 被平台包裹的秘密值），默认规则集不认识它——一个**明文**落盘的条目（例如调试时跳过了平台包裹）
# 里会直接出现 32 字节私钥标量，而默认规则对「裸二进制里的一段随机字节」无能为力。
# 因此只加一条模式：命中即说明**被编码后的**明文条目（例如粘贴进代码块、日志或 dump 的 base64 文本）
# 被提交。
#
# `keywords` 的选择（RV2-WP3 G6）：gitleaks 把 `keywords` 当作规则的**前置过滤**（只在其出现的
# 分片里评估该规则）。因此这里**不能**写 `ACPK`——编码后的文本里不存在字面 `ACPK`，规则会永不
# 评估。这里写编码后的前缀 `QUNQS`（`ACPK` 的 base64/base64url 前缀），与 regex 一致。
#
# 诚实的限制（**不假装覆盖**）：
# 1. 本规则只覆盖 `ACPK` 的 base64/base64url 编码形态；**原始二进制**条目文件（magic + 二进制字节段）
#    与**被 DPAPI 包裹后的密文**都无法用模式识别；
# 2. 因此「条目被误提交」主要靠路径约定（keystore 目录不进仓库）与凭据轮换流程发现，不由本规则承担。
[[rules]]
id = "acpr-keystore-plaintext-entry"
description = "自研 keystore 条目的明文字节段：magic ACPK 及其后的密钥材料（base64url/base64 编码形态）"
regex = '''(?i)QUNQS[A-Za-z0-9+_-]{16,}={0,2}'''
entropy = 0
keywords = [
    "QUNQS",
]
# 未验证项（如实登记）：本机无 gitleaks，因此「规则确实会在合成样例上命中」这一点**没有**本地证据，
# 只能由 CI 的 `secrets` job 承担；若 CI 侧判定该规则从未命中，应在此处调整 keywords 或改用默认规则集。

# 已记录的假阳性（按本文件第 1、2 条政策的最小范围条目）。
#
# 命中对象：`Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==` —— **RFC 6455 §1.3 的公开握手示例值**
# （规范正文里的示例字符串），被默认规则集的 `generic-api-key` 当作候选凭据。它不是任何真实凭据，
# 也没有对应的服务端秘密；由主 Agent 在 `node-link-owner` 变更交付期核对（PR #28 的 `secrets` job）。
# 代码侧已把该字面量移除（`test_client.rs` 改为运行时由 16 字节数组编码），这条只为覆盖**历史的那个提交**
# 仍在 PR 范围内、而 PR 范围扫描会重放旧 diff 的情形；下次全历史扫描（每日 `schedule`）同样受益。
# 范围故意收窄到「确切字符串 + 确切文件」，不放行目录、不放宽全局规则；若该文件将来不再包含 WebSocket
# 示例请求，应删掉此条。
[[allowlists]]
description = "RFC 6455 §1.3 公开示例的 Sec-WebSocket-Key（非凭据）；代码已移除该字面量，此条仅豁免历史 diff"
regexTarget = "line"
regexes = ['''Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==''']
paths = ['''crates/server/src/transport/net/test_client\.rs''']

# 每日 `schedule` 的**全历史**扫描命中的固定向量与假阳性（2026-10-11 补登，共 10 处命中、4 条）。
#
# 为什么以前没发现：push / pull_request 只扫**本次范围**（实测日志形如「1 commits scanned」），
# 而这些命中来自**历史提交**（引入提交见下），所以 PR 上一直是绿的；只有每日 `schedule` 的全历史
# 扫描（实测「204 commits scanned」）才会暴露。
#
# 每一处命中值都核对过：A/B/C 三条里的值是**合成的计数序列**——解码后分别是 32 字节的
# `00 01 02 … 1F`、可打印 ASCII 的连号（PQRSTUVWXYZ 起、到 no 止）、32 字节的 `A0 A1 … BF`——
# 不是任何真实凭据，也没有对应的服务端秘密；D 那条是文档协议示例里的**节点标识**（UUID），
# 默认规则集只因字段名含 `access` 而误判。
#
# 以下条目都只豁免「确切的值 + 确切的一个或几个文件」：不放行目录、不放宽全局规则。
# 代价如实记录：以后新增合成向量或同类文档字段，这个 job 会再红一次，需要再补一条。

[[allowlists]]
description = "公开固定测试向量：配对 QR 载荷的合成 pairingSecret（base64url 解码为 00 01 … 1F 的 32 字节计数序列）。不是凭据，也没有对应的服务端秘密；fixtures/sync/v1/valid/pairing-qr-payload.json 与 clients/app 的单测共用同一向量。由主 Agent 于 2026-10-11 核对（依据：值解码后的计数序列 + 本地 gitleaks 8.30.1 全历史扫描）"
regexTarget = "line"
regexes = ['''"AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8"''']
paths = ['''fixtures/sync/v1/valid/pairing-qr-payload\.json''', '''clients/app/src/composition\.test\.ts''']

[[allowlists]]
description = "公开固定测试向量：node-link 配对 transcript 三个 fixture 的合成 hmacKeyBase64url（base64url 解码为 32 字节可打印 ASCII 连号，PQRSTUVWXYZ 起、到 no 止）。不是凭据；由 compatibility/transcripts/v1/transcripts.json 的表驱动重算。由主 Agent 于 2026-10-11 核对"
regexTarget = "line"
regexes = ['''"UFFSU1RVVldYWVpbXF1eX2BhYmNkZWZnaGlqa2xtbm8"''']
paths = ['''fixtures/node-link/v1/transcripts/pairing-(proof|status|sas)\.json''']

[[allowlists]]
description = "公开固定测试向量：sync 配对 transcript 三个 fixture 的合成 hmacKeyBase64url（base64url 解码为 A0 A1 … BF 的 32 字节计数序列）。不是凭据；同样由 compatibility/transcripts/v1/transcripts.json 的表驱动重算。由主 Agent 于 2026-10-11 核对"
regexTarget = "line"
regexes = ['''"oKGio6SlpqeoqaqrrK2ur7CxsrO0tba3uLm6u7y9vr8"''']
paths = ['''fixtures/sync/v1/transcripts/pairing-(proof|sas|status)\.json''']

[[allowlists]]
description = "已记录的假阳性：docs/NODE_LINK_PROTOCOL.md 协议示例里 accessNodeId 的值是公开的节点标识（UUID），不是凭据；默认规则集 generic-api-key 因字段名含 access 而误判。只豁免该文档里这一类字段，不放行目录、不放宽全局规则。由主 Agent 于 2026-10-11 核对"
regexTarget = "line"
regexes = ['''"accessNodeId": "[0-9a-f-]{36}"''']
paths = ['''docs/NODE_LINK_PROTOCOL\.md''']
