[workspace]
resolver = "3"
members = [
    "crates/acpr-transcript",
    "crates/acpr-wire",
    "crates/core",
    "crates/storage-sqlite",
    "crates/sync-protocol",
    "crates/identity-auth",
    "crates/identity-keystore",
    "crates/node-link-protocol",
    "crates/acp-protocol",
    "crates/agent-host",
    "crates/server",
    "crates/app",
]
# `windows-local-ipc` 是切片 4 自研的最小 Win32 FFI wrapper（docs/MODULE_ARCHITECTURE.md §3.1、`daemon-cli-and-local-admin` 变更的 design.md 决策 3）：
# 它以**仓库内 path 依赖**被 `server` 消费，但不能继承 workspace 的 `unsafe_code = "forbid"`（它必须写 `unsafe`），
# 也不发布 crates.io。`exclude` 是这条边界的实现手段：workspace 的 path 依赖默认会自动成为成员，写进 `exclude`
# 才让它留在成员之外（实测于独立探针 workspace：排除后
# `cargo metadata --no-deps` 仍把该目录列为依赖、members 里不含它，`cargo build` 正常工作，
# 且无需在 vendor crate 里再写 `[workspace]`）。
# 后果：它不是 workspace 成员，因此也不参与 §5 依赖矩阵的「行」比对，但必须成为矩阵的「列」（见 §5 表下注记）。
exclude = ["vendor/windows-local-ipc"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/lindongfang/acp-remote"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `arbitrary_precision`：视图的开放对象要经 serde 的 flatten 缓冲，没有它时超出 u64/i64 的整数字面量
# 会被降级成浮点——那等于静默改写对端发来的未来字段。仓库在信封层已用 30 位整数做保真判据，这里保持一致。
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
base64 = "0.23"

# core 的端口是可 dyn 化的异步 trait（docs/CORE_PORTS_AND_STORAGE.md §2）：async-trait 只是 proc-macro，
# 不引入 runtime，因此 core 仍然不依赖 Tokio。
async-trait = "0.1"
# runtime 与数据库依赖：`storage-sqlite`（sqlx 与 runtime）与 `agent-host`（tokio 的进程/IO 类型）持有；
# **runtime 本身由组合根启动**，两个适配器都不自己建 runtime（docs/MODULE_ARCHITECTURE.md §4.5/§4.7）。
# `net`/`io-util`/`signal` 是切片 4 新增的基线 feature：`server::transport::local` 用 `net` 的 Named Pipe /
# Unix socket safe API 与 `io-util` 的连接读写，`app` 用 `signal` 驱动关闭序列。feature 是加法的，
# `agent-host` 仍在自己 manifest 里增量要 `process`/`io-util`/`macros`/`rt`（它自己的消费面），
# 这里只登记跨 crate 共用的部分，不替下游多开。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
# ID 生成（IdGenerator 的实现侧）：newtype 的形状校验在 core，随机来源在组合根。
uuid = { version = "1", features = ["v4"] }

# `agent-host` 的日志与平台进程树依赖（docs/MODULE_ARCHITECTURE.md §3.1/§4.5）。
# `tracing` 只产出结构化事件，订阅器由组合根初始化；凭据值、prompt 正文与规范化路径不得进入字段。
tracing = "0.1"
# Windows Job Object（safe API）：每个 Agent 一个 Job + `KILL_ON_JOB_CLOSE`，见 §4.5。
win32job = "2"
# Unix 进程组结束（`killpg`）；Windows 构建中不参与编译。
# 用 safe wrapper（`nix`）而不直接用 `libc`：workspace 固定 `unsafe_code = "forbid"`，直接 FFI 必须写 `unsafe`。
# `socket`/`user` 是切片 4 新增的基线 feature：`server::transport::local` 用 `SO_PEERCRED` 比对对端 uid
# （`sockopt::PeerCredentials` 与 `getsockopt` 都不在 `net` 门后，因此不必开 `net`）与当前进程的 `getuid`。
nix = { version = "0.31", default-features = false, features = ["signal", "process", "socket", "user"] }

# 密码学原语按 docs/MODULE_ARCHITECTURE.md §3.1 固定版本；已由 `identity-auth`（验签）与 `identity-keystore`
# （进程内签名）消费，不要在别处另选实现。
# **默认 feature 关闭**：core 只做曲线级点校验（`arithmetic`），签名/验签与编码栈（`ecdsa`/`rfc6979`/
# `hmac`/`signature`/`pkcs8`…）属身份边界，`identity-auth`/`identity-keystore` 用 `features = ["ecdsa"]`
# 增量开启（**不开 `pkcs8`**：私钥存 32 字节标量，签名输出 64 字节 P1363，不引入 DER 路径）；
# feature 是加法的，因此这里不能替下游「少开」，只能由默认值决定基线（`AGENTS.md` §10）。
p256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
sha2 = "0.11"
hmac = "0.13"

# `identity-keystore` 的熵源与平台安全存储依赖（docs/MODULE_ARCHITECTURE.md §3.1/§4.12）：
# `getrandom` 已是 lock 中的既有 crate（`uuid` 的 v4 用过 0.4.3），MIT OR Apache-2.0；
# `windows-dpapi` 是 DPAPI wrapper 的首选候选（安全 API + `Scope::User`，MIT OR Apache-2.0，
# 已知代价：传递依赖已停止维护的 `winapi 0.3`），只在 `cfg(windows)` 下参与编译，
# 其选型结论按 SECURITY_DESIGN.md §20 实证后写回 MODULE_ARCHITECTURE.md §4.12。
getrandom = "0.4"
windows-dpapi = "0.2"

# `server` / `app`（切片 4：本地管理通道与 CLI）的直接依赖，版本口径只维护在这里。
# 三者都按 docs/SECURITY_DESIGN.md §20 核验过语义、许可证、MSRV 与维护状态；结论与依据见
# docs/MODULE_ARCHITECTURE.md §3.1（`daemon-cli-and-local-admin` 的 WP1 报告里附原始证据）。
# CLI 子命令解析；`derive` 是 clap 的可选 feature（clap_derive）。
clap = { version = "4.6", features = ["derive"] }
# `app` 读 CONFIG_REFERENCE.md 的配置文件（只读，不回写，因此不引入 toml_edit）。
toml = "1.1"
# 单实例锁的 OS advisory 文件锁：unix 走 `flock`、Windows 走 `LockFileEx`，公开 API 只有独占锁 +
# `try_lock`/`TryLockError`（safe API，unsafe 收敛在 crate 内部）。落选候选 `fd-lock` 的理由见 docs/MODULE_ARCHITECTURE.md §3.1。
fs4 = "1.1"
# `provider configure` 的凭据值**无回显**读取（`cli-commands` 规格的场景「凭据无回显录入」）：默认配置就
# 从终端设备（unix `/dev/tty`、Windows `CONIN$`）读且关回显，因此管道/stdin 无法注入凭据值。
# 选型结论（版本、许可证、MSRV、传递依赖）见 WP4b 报告与 docs/MODULE_ARCHITECTURE.md §3.1。
rpassword = "7.5"

# `server` 的 Node Link HTTP/WS/TLS 栈（`node-link-owner` 变更 WP1 按 docs/SECURITY_DESIGN.md §20 的四判据
# ——语义适配、许可证、MSRV ≤ 1.85、维护状态——核验后登记）：版本口径只维护在这里，完整核验证据、来源与落选候选
# （`aws-lc-rs`/`rustls-rustcrypto`/`axum-server`/`rustls-pemfile`）见 docs/MODULE_ARCHITECTURE.md §3.1 的
# `[决定]`（2026-09-26）。
#
# HTTP 路由 + WebSocket upgrade（`axum::extract::ws`）：保留 axum 自己的基线 feature（`http1`/`tokio`/`json`/
# `tracing` 等），只增量开启 `ws`。axum 的 ws 默认不协商 `permessage-deflate`（它不依赖 `tungstenite` 的压缩
# feature），因此「协商到压缩必须拒绝」只需在 upgrade 层显式判定，不靠关闭某个 feature。
axum = { version = "0.8", features = ["ws"] }
# TLS `direct` 模式的终止实现。**必须关默认 feature**：rustls 0.23 的默认 provider 是 `aws-lc-rs`，它经
# `aws-lc-sys` 要求 CMake 参与构建（build-dependency `cmake`，Windows x86_64 另需 NASM 或 `prebuilt-nasm`），
# 那会把「固定 Rust 工具链即可构建」（rust-toolchain.toml 的约定）变成「还要装构建工具」，而且本机与 CI 判定
# 会分叉。这里显式选择 rustls 自带的 `ring` provider：rustls 自身仍是纯 Rust，原生实现局限在一个已审计的 crate 内。
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging", "ring"] }
# 同理，`tokio-rustls` 的默认 feature 会经 `rustls/aws_lc_rs` 把 provider 拉回 aws-lc-rs（feature 是加法的，
# 只关 rustls 一边的默认值不够），因此这里也关默认 feature、只开 `ring`。
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
# PEM 解析用 rustls 家族自己的 `pem` 模块（`rustls_pki_types::pem::PemObject`）：design.md D1 列的候选
# `rustls-pemfile 2` 已被上游归档（GitHub archived，README 明确指向本模块），因此改登记它的后继 API；
# 该 crate 本就是 rustls 的传递依赖，不引入新的传递依赖（旧接口与其 `base64` 依赖都绕开了）。
rustls-pki-types = { version = "1", features = ["std"] }
# WebSocket 读写半边拆分（`session-write-deadline` 变更 WP1；消费方是 `server::transport::net::ws` 的
# `WsConnection::split`，设计见 `crates/server/src/node_link/conn/session.rs` 模块文档「写路径与写任务」）：
# 只用到 `StreamExt::split`，把一条 `WebSocket` 拆成可分别 poll 的 `SplitSink`/`SplitStream`，好让写半边
# 交给每连接的写任务、判据不再被 socket 写拖住。
# - 必要性：读写分离是把「写卡住拖住会话判据」这个缺口修掉的最小代价；
# - 维护状态：`rust-lang/futures-rs`（Apache-2.0 OR MIT）随生态持续发版，`futures-util 0.3.34` 已是
#   axum 0.8.9 与 `tokio-tungstenite 0.29`（HTTP/WS 栈）的传递依赖，本次只是把已有节点提为直接依赖，
#   **不新增依赖树节点**，也不抬高 MSRV（该栈本就与解析到的同一版本一起构建）；
# - 落选候选：手写只含 `split` 语义的薄封装（等于自己再实现一遍 `BiLock`/`split`，还要自行保证两半的
#   `poll` 安全）；`Arc<Mutex<WebSocket>>` 共享 socket（会在每帧上持锁、让 `recv` 与写互相阻塞，比缺口
#   本身更糟）。
# features 取最小集：`sink` 门控 `StreamExt::split` 与 `SinkExt` 本身，`alloc` 是 `split` 依赖的
# `BiLock` 的第二道门；`std`/`async-await` 等本处用不到（feature 是加法的，其余由 axum 那侧统一开启）。
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }
# 测试用自签证书的生成（仅 dev-dependency，供 `crates/server/tests` 的 TLS `direct` 用例现算 ECDSA P-256
# 自签证书与私钥）：因此仓库里不提交任何私钥材料，`.gitleaks.toml` 不需要为此新增允许清单条目。
# 实际启用的依赖链只有 `pem`/`ring`/`rustls-pki-types`/`time`/`yasna`（`zeroize`/`x509-parser`/`aws-lc-rs` 为可选、未启用）；启用链新增的解析节点是
# `pem`/`ring`/`yasna`/`time`（及 `time-core`/`time-macros`/`deranged`/`powerfmt`/`num-conv`）与 `rustls-pki-types`；`base64 0.22.1` 不是本批
# 新增，而是 base 锁既有版本，这里由 `pem` 与 axum 的 `ws` 复用、与既有 0.23 并存（`[bans] multiple-versions = "warn"` 只提示）。MSRV 与版本选择依据见 §3.1 的 `[决定]`。
rcgen = "0.14"

# `server` 的前端产物嵌入（`sync-ui-hosting` 变更 WP2；决策见 design.md D2，消费方是
# `transport::net::ui`）：把构建产物目录的内容以 `include_bytes!` 编入二进制，运行期零 IO、零路径解析——
# 表里没有的路径根本查不到，静态面因此不存在路径穿越面；MIME 与回退仍由 `transport::net::static_ui` 持有。
# `AGENTS.md` §8 的五项判据：
# - 必要性：PWA 必须与 Daemon **同源**加载（前端从 canonical origin 反推 WebSocket 地址，没有 endpoint
#   配置项），产物因此要随二进制发布，不能要求部署时另放一份磁盘目录；
# - 维护状态：`pyrossh/rust-embed` 8.13.0，上游自述 `passively-maintained`（低频但持续发版），
#   `rust-version = 1.80` ≤ 本仓库 MSRV；
# - 许可证：本 crate 与 `rust-embed-impl`/`rust-embed-utils`/`mime_guess` 都是 MIT；
#   `unicase` 是 `MIT OR Apache-2.0`、`walkdir`/`same-file` 是 `Unlicense/MIT`、`winapi-util` 是
#   `Unlicense OR MIT`——四者都靠 **MIT 分支**落在 `deny.toml` 的 `[licenses] allow` 里（白名单没有
#   Unlicense 条目，但 OR 表达式有一个分支被允许即通过）；
# - 平台支持：纯 Rust、无原生构建步骤；`walkdir` 家族在 Windows 上经 `winapi-util`（依赖
#   `windows-sys >=0.48, <=0.61`，由锁里既有的 0.61.2 满足，不新增节点），与本仓库两个交付目标
#   （Windows x64、Linux x86_64）一致；
# - 安全风险：读目录发生在编译期，运行期只查编译期生成的键表；`deny.toml` 的 `all-features = true`
#   下可选特性均未启用（`compression`/`include-exclude`/`mime-guess` 全关）。
# 落选候选（design.md D2 已做过一轮对比，这里补许可证核对结论）：`include_dir` 同样合格，但需要自己
# 拼内容类型映射与回退逻辑，而本仓库的内容类型映射唯一一份在 `static_ui`，不该有第二处；
# `tower-http` 的 `ServeDir`/`ServeFile` 服务磁盘目录，与「嵌入二进制」的裁定冲突；手写 build script
# 生成 `include_bytes!` 表等于把 `rust-embed` 的活再写一遍。
# 版本口径与漂移防护：下面的闭包、许可证与「无默认 feature」结论都是对 **8.13.0** 实测的，而 `8.13`
# （caret 语义 = `>=8.13.0, <9.0.0`）本身**挡不住**小版本漂移——真正冻结这份闭包的是入库的
# `Cargo.lock` 与门禁里的 `--locked`。因此**升级小版本时必须按上面的清单重核**：新版本可能重新引入
# 默认 feature，那会静默改变依赖图与许可证判定。
# `debug-embed` 必须开：否则 debug 构建会运行期读磁盘（行为随磁盘状态漂移，产物被删后还返回空）。
# 三个**不要开**的特性：`interpolate-folder-path`（经 `shellexpand → dirs → dirs-sys → option-ext`
# 引入 MPL-2.0，不在白名单里）；`mime-guess`（内容类型不是本 crate 的事，映射表不得有第二份）；
# `compression`（产物已由前端构建压缩，多一层解压换不来收益）。
# 依赖选型的核验证据按 `AGENTS.md` §9 的映射由 `docs/MODULE_ARCHITECTURE.md` §3.1 承接（该节对每一批
# 新增依赖都有 `[决定]` 条目）：本节给的是可自足的判据，§3.1 的条目作为 `sync-ui-hosting` 变更的落地项
# 写在 `openspec/changes/archive/2026-10-15-sync-ui-hosting/tasks.md` 的 4.6。
rust-embed = { version = "8.13", features = ["debug-embed"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
