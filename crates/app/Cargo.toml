[package]
name = "app"
description = "组合根与入口：Daemon 生命周期、配置加载与 `acp-remote` 可执行程序"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# 唯一可执行文件：`daemon start` 是前台 Daemon 进程，其余子命令（`LOCAL_ADMIN_PROTOCOL.md` §5.8 映射表）
# 是本地通道的薄客户端，`acp-stdio` 只是 stdin/stdout ↔ channel `0x02` 的字节泵。
[[bin]]
name = "acp-remote"
path = "src/main.rs"

# 依赖方向以 docs/MODULE_ARCHITECTURE.md §5 为唯一判据（scripts/check-crate-boundaries.mjs 断言）：
# `app` 行的每个格都是 ✓——组合根装配全部具体实现，但自身只做装配（`MODULE_ARCHITECTURE.md` §5
# 「`app` 可以依赖全部具体 crate，但只做装配；任何其他 crate 不得依赖 `app`」）。
[dependencies]
# 用例面与端口（`UseCaseDeps` 的每个字段都由本 crate 注入具体实现）。
core = { path = "../core" }
# SQLite 持久化后端：本 crate 是唯一允许构造它的地方（CLI 侧不直连数据库，见 `app::client`）。
storage-sqlite = { path = "../storage-sqlite" }
# 身份状态机与 keystore 端口（`Authority`、`IdentityKeystore`、`SecretPurpose`）。
identity-auth = { path = "../identity-auth" }
# 平台安全存储的具体实现（`FileKeystore` + `OsEntropy`）与显式开发模式下的 `EphemeralKeystore`。
# `MODULE_ARCHITECTURE.md` §5 的注记：除 `app` 外没有 crate 依赖 `identity-keystore`。
identity-keystore = { path = "../identity-keystore" }
# 本机 Agent 的 `AgentCatalog` 与 `SessionBackendFactory` 实现（§4.5）：组合根不另造目录实现，
# 也不在 `app` 里复制「命令可解析」这类适配器逻辑。本切片不接 `spawn_idle_sweep`
# （`sessions.idle_timeout_ms` 属「已知但未接线」，见 `app::config`）。
agent-host = { path = "../agent-host" }
# 入站适配器：本地管理通道（`transport::local`）与管理信封/方法路由（`local_admin`）。
server = { path = "../server" }
# `rt-multi-thread`/`macros`/`sync`/`time`/`net`/`io-util`/`signal` 由 workspace 基线开启：runtime 由本
# crate 创建并持有（`docs/MODULE_ARCHITECTURE.md` §4.5/§4.7：适配器不自建 runtime），`signal` 驱动关闭序列。
# `io-std` 是 `acp-stdio` 字节泵自己的消费面（`tokio::io::stdin/stdout`），因此只在本 manifest 增量开启，
# 不替其他 crate 多开（`AGENTS.md` §12：feature 是加法的，基线只登记跨 crate 共用的部分）。
tokio = { workspace = true, features = ["io-std"] }
# 单实例锁：OS advisory 文件锁。**必须全限定调用** `fs4::FileExt::try_lock`——固定工具链的
# `std::fs::File::try_lock`（1.89 稳定）同名且方法解析优先级更高，用错等于把 MSRV 抬到 1.89
# （`MODULE_ARCHITECTURE.md` §3.1 的调用点约束，WP4 任务单明写）。
fs4.workspace = true
# CLI 解析与 `docs/CONFIG_REFERENCE.md` 的配置文件解析（只读，不回写）。
clap.workspace = true
toml.workspace = true
# `provider configure` 的无回显凭据读取（只做「关回显读一行」；凭据值不经命令行参数/文件/stdout）。
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# 结构化日志：本 crate 只产出事件，并在组合根初始化订阅器（`logging.*`）。
tracing.workspace = true
# 本节点标识由节点身份公钥**确定性派生**（`app::identity`），以及审计/凭据标签的摘要。
sha2.workspace = true
# `IdGenerator` 与锁文件/请求关联 id 的随机来源（v4 = 系统 CSPRNG）。
uuid.workspace = true
# `DaemonControl`/`ConnectionCloser`/`AuditHook`/`CredentialResolver` 都是可 dyn 化的异步 trait。
async-trait.workspace = true

# 集成测试自己也用到这批依赖（JSON、摘要、runtime），在测试目标上显式声明，不依赖
# 「普通依赖是否对测试目标可见」这一隐式前提。
[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
# 受控路径全链路集成测试扮演 Access Node：它按 Access 侧的方式构造 wire 消息、认领证明与节点证明，
# 因此需要与 `node-link-client` 相同的 wire 类型、transcript 输入与签名原语（P-256 的 `ecdsa` 只在
# 测试目标上开，生产 `app` 不签名）。版本与 feature 口径只在根 `Cargo.toml`。
node-link-protocol = { path = "../node-link-protocol" }
identity-auth = { path = "../identity-auth" }
p256 = { workspace = true, features = ["ecdsa"] }
base64.workspace = true
# TLS `direct` 轮次的客户端：自签证书现算（仓库不提交任何私钥材料）+ rustls 客户端只信任该证书。
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true

[lints]
workspace = true
