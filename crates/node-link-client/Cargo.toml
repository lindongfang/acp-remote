[package]
name = "node-link-client"
description = "Access Node 侧的 Node Link 出站适配器：握手、重连、catalog、无正文投递、远程会话与附件转发"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# 依赖方向以 docs/MODULE_ARCHITECTURE.md §5 为唯一判据（scripts/check-crate-boundaries.mjs 断言）：
# `node-link-client` 是出站适配器，允许依赖 core、wire 协议、共享 wire 叶子与 identity-auth（只用其
# 端口与 transcript 校验/装配，不依赖 keystore 平台实现）。它**不依赖** `server`/`agent-host`/
# `storage-sqlite`：连接生命周期与 wire 编解码在本 crate，持久化经注入的 core 端口。
[dependencies]
# 端口（`AgentCatalog`/`SessionBackendFactory`/`SessionEndpoint`/`RemoteDeliveryStore`）、值对象与
# 用例面（`Broker::deliver_imported` 等）。core 不依赖 runtime，这里反向依赖不构成环。
core = { path = "../core" }
# Node Link v1 的 wire 合同（信封、握手、catalog、resource、command 与附件帧）。
node-link-protocol = { path = "../node-link-protocol" }
# 连接挑战/节点证明的 transcript 装配与验签（`NodeLinkChallenge::verify`）。Access 侧的签名经
# `identity_auth::IdentityKeystore` 端口完成，因此本 crate 不持私钥、不引入平台 API。
identity-auth = { path = "../identity-auth" }
# `payloadDigest` = base64url(SHA-256(ACPR-CJ1(payload))) 的唯一实现（ADR-0007：协议 crate 不导出
# `cj1`）；本 crate 只用它的 `cj1` 与 `RawObject`/`RawAcp` 值对象，不复制规范 JSON 逻辑。
acpr-wire = { path = "../acpr-wire" }
# 无填充 base64url：只用于从原始字节构造 `Base64Url<N>`（该类型没有字节构造入口）。
base64.workspace = true
# `payloadDigest` 的核对需要与 Owner 相同的 SHA-256（ACPR-CJ1 的规范文本先经 `acpr-wire`）。
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
# `rt`：连接任务的 spawn/join（所有权由 `LinkSupervisor` 持有）；`net`/`io-util`/`sync`/`time` 来自
# workspace 基线。
tokio = { workspace = true, features = ["rt"] }
# 读写半边拆分（`StreamExt::split`）与 `SinkExt`：版本与 feature 口径只在根 `Cargo.toml`。
futures-util = { workspace = true }
# WebSocket 客户端握手与帧编解码：不启用 `connect`/TLS feature——TCP、TLS 与 HTTP upgrade 都在本 crate
# 内显式完成，TLS 信任锚由调用方以证书注入（不存在「跳过校验」的隐式路径）。
tokio-tungstenite = { workspace = true, features = ["handshake"] }
# TLS 客户端（`direct` 模式的对端）：provider 固定 `ring`，与 server 侧同一口径。
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
# 连接标识/客户端 nonce/消息标识的随机来源（系统 CSPRNG 的 v4）。
uuid.workspace = true

[dev-dependencies]
# `test-util`：附件握手超时用例用暂停时钟（15 s 常量不变成真实等待）；不引入新依赖。
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
# 测试用的自签证书与真实 TLS/WebSocket 服务端（不提交任何私钥材料）。
rcgen.workspace = true
# 脚本化 Agent 身份（固定私钥派生 P-256 签名），验证握手 transcript 而不引入 keystore。
p256 = { workspace = true, features = ["ecdsa"] }
# 与协议 crate 的 transcript 表共用同一份编码器（握手用例复算签名输入）。
acpr-transcript = { path = "../acpr-transcript" }

[lints]
workspace = true
