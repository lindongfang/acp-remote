[package]
name = "core"
description = "领域模型、用例、端口与会话协调（不依赖 runtime、wire protocol 或数据库）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# 包名保持 `core`（与 MODULE_ARCHITECTURE §3/§5 的 crate 名一致），但**库名**必须是 `acp_core`：
# 一个名为 `core` 的依赖会在依赖方的宏展开里遮蔽 sysroot 的 `core`，使 `thiserror::Error` 之类
# 展开出的 `core::fmt` 解析到本 crate 而编译失败。依赖方照旧写 `core = { path = "../core" }`，
# 代码里用 `acp_core::…`。
[lib]
name = "acp_core"

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
# 对端公钥值对象（§11.5）在构造期做 SEC1 点校验并用 SHA-256 派生指纹：P-256 的曲线运算必须有经过
# 审查的实现，因此 core 直接依赖 workspace 已 pin 的 `p256`/`sha2`，不自行实现曲线校验。
# **按需最小 feature**：core 只做曲线级点校验，不签名也不验签（那属身份边界），因此不继承 workspace 的
# `ecdsa`——否则 `ecdsa`/`rfc6979`/`hmac`/`signature`/`pkcs8` 等签名与编码栈会进入 core 的冻结依赖闭包
# （`AGENTS.md` §12、`docs/CORE_PORTS_AND_STORAGE.md` §9 判据 13、`docs/MODULE_ARCHITECTURE.md` §3.1）。
# 新增该依赖必须同步 §9 判据 13、`scripts/check-crate-boundaries.mjs` 的 allow-list 与 AGENTS.md §12。
p256.workspace = true
sha2.workspace = true

[lints]
workspace = true
