[package]
name = "server"
description = "入站协议 adapter 的宿主；本切片只落地本地管理通道（transport::local 与 local_admin）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# 依赖方向以 docs/MODULE_ARCHITECTURE.md §5 为唯一判据（scripts/check-crate-boundaries.mjs 断言）：
# `server` 被允许依赖 core / acp-protocol / sync-protocol / node-link-protocol / identity-auth /
# windows-local-ipc。WP3a（transport::local + local_admin 的信封层）只需要 tokio 的类型与 safe API、
# serde/serde_json 的信封编解码、tracing、sha2（§2.1 的用户标识哈希）与 uuid（两个随机标识 newtype）；
# WP3b1 的方法路由（`local_admin::{router,params,audit,daemon}`）在此基础上按合同接线 core 用例与
# identity-auth 的 keystore 端口（`docs/LOCAL_ADMIN_PROTOCOL.md` §5.1/§5.2/§5.5/§5.6、design.md 决策 6）。
[dependencies]
# 本地管理方法只经 `core::use_cases` 与 core 端口取值（`Actor::LocalCli`），不查 SQLite、不绕过用例层。
core = { path = "../core" }
# `provider.configure` 的凭据值只经 `identity-auth` 定义的 keystore 端口写入（端口实现由组合根注入），
# 本 crate 不依赖 `identity-keystore`（`MODULE_ARCHITECTURE.md` §5 的「除 app 外没有 crate 依赖它」）。
identity-auth = { path = "../identity-auth" }
# `device.pair.begin`/`node.pair.begin` 的 `pairingUrl` 内嵌二维码 payload，其形状由两个协议 crate 拥有
# （`SYNC_PROTOCOL.md` §7.1、`NODE_LINK_PROTOCOL.md` §13.1）：本 crate 用它们的 `QrPayload` 类型序列化，
# 不复制字段名、不手写键。依赖方向见 `MODULE_ARCHITECTURE.md` §5 的 server 行（对两者均为 ✓）。
sync-protocol = { path = "../sync-protocol" }
node-link-protocol = { path = "../node-link-protocol" }
# `daemon.status` 的 `nodePublicKey` 是无填充 base64url 的 65 字节 SEC1 公钥（§1.1 的二进制编码规则），
# 编码发生在 wire 边界（本 crate），因此 core 的 `PeerPublicKey` 不引入 serde/base64。
base64.workspace = true
# `rt`：`tokio::task::JoinSet` 与 `spawn`（管理连接上并存多条未完成请求，§4 规则 2 的 32 条上限需要它）；
# `net`/`io-util`/`macros` 由 workspace 基线开启（Named Pipe / Unix socket 与连接读写）。
tokio = { workspace = true, features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# 结构化日志：只写协议元数据与连接级原因，不写凭据、prompt 或完整敏感路径。
tracing.workspace = true
# §2.1 的 `<userSidHashHex>` = 用户标识字符串 UTF-8 字节的 SHA-256 小写 hex 前 16 字符。
sha2.workspace = true
# `InstanceId`（§2.1）与 `FacadeAttachmentId`（§3.1）的 16 字符小写 hex 随机来源（`v4` 已在 workspace 开启）。
uuid.workspace = true
# `LocalAdminHandler` 是可 dyn 化的异步 trait（与 core 的端口用同一个 proc-macro，不引入 runtime）。
async-trait.workspace = true

# --- Node Link（`node-link-owner` 变更，WP1 只登记依赖，使用代码自 WP2 的 `transport::net` 起落地）---
# 版本口径只在根 `Cargo.toml` 的 `[workspace.dependencies]`，选型与核验结论见 docs/MODULE_ARCHITECTURE.md §3.1。
# ACPR-CJ1 规范 JSON 与 digest 计算（§5 表下注记：只为 `payloadDigest`/`snapshotDigest` 的前像）。
acpr-wire = { path = "../acpr-wire" }
# 共享 listener 的 HTTP 路由与 WebSocket upgrade（`axum::extract::ws`）。
axum.workspace = true
# TLS `direct` 模式终止：rustls + tokio-rustls（provider = `ring`；为什么必须关默认 feature 见根 `Cargo.toml`）。
rustls.workspace = true
tokio-rustls.workspace = true
# `direct` 模式的证书/私钥 PEM 解析（`rustls_pki_types::pem::PemObject`）。
rustls-pki-types.workspace = true

[target.'cfg(windows)'.dependencies]
# WP2 冻结的 safe API（SDDL 创建首个 pipe 实例、当前用户 SID、已连接对端的 SID）；非 Windows 上该 crate
# 编译为空 crate，因此调用点必须 cfg 门控（本 crate 的平台代码只在 platform/windows.rs 里出现）。
windows-local-ipc = { path = "../../vendor/windows-local-ipc" }

[target.'cfg(unix)'.dependencies]
# `SO_PEERCRED` 取对端 uid（§2.2）：safe wrapper，workspace 固定 unsafe_code = "forbid"。
nix.workspace = true

# 集成测试目标自己也用到这批依赖（同一个 proc-macro、JSON、sha2、runtime），在测试目标上显式声明，
# 不依赖「普通依赖是否对测试目标可见」这一隐式前提。
[dev-dependencies]
async-trait.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
# 单元测试用最小 fake 端口构造 `core::use_cases::UseCases`（只实现被路由触及的方法）。
core = { path = "../core" }
identity-auth = { path = "../identity-auth" }
# TLS `direct` 用例现算 ECDSA P-256 自签证书与私钥（因此仓库不提交任何私钥材料）。
rcgen.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# Windows 用例直接核对 pipe 名里的 SID 哈希规则（§2.1），需要与实现同一个 SID 来源。
windows-local-ipc = { path = "../../vendor/windows-local-ipc" }

[lints]
workspace = true
