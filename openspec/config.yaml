schema: spec-driven
context: |
  # Project Profile
  本分支按 docs/HARNESS_CONTROL_PLANE_REDESIGN.md 构建，不兼容旧系统。
  Windows Rust 节点、CLI、SQLite 身份与同源 Web 配对/管理已由 establish-node-access 交付归档；通用会话闭环、共享队列、严格审批与 ACP 重放/当前连接视图已由 deliver-codex-session-loop 交付归档。
  当前产品规则以 openspec/specs/ 各长期规格与活动变更的增量规格为唯一权威；工程状态与运行命令以 README.md 和 package.json 为准。
  .agents/ 是已有技能资源，未经任务授权不得修改。

  # Sources and Commands
  产品总体目标：docs/HARNESS_CONTROL_PLANE_REDESIGN.md；能力归属与依赖：docs/REBUILD_CAPABILITY_MAP.md；执行与安全硬约束：AGENTS.md、docs/code-standards.md。
  开发检查入口：根目录 npm ci，Web 目录 npm ci --prefix clients/web；文档与结构校验使用 npm run check:spec（单变更实施门禁使用 node testing/suites/verify-suite.mjs --change <name>），完整工程检查使用 npm run check 与 npm run build:rust，Rust 工具链只读 rust-toolchain.toml。
  提交信息词表以 commitlint.config.mjs 为准，默认主分支 main（PR squash 合并，不直推 main）。
  新术语首次需要时维护 openspec/GLOSSARY.md。已归档证据仅在同版本同范围内复用；新变更的协议、安全与真实 Harness 闭环按当前变更独立验证。

# Artifact 规则：追加到对应 artifact 的 instructions 上，不改模板正文。
rules:
  proposal:
    - 必须在 `## Success Criteria` 节保留用户原始要求、硬约束、非目标与成功判据；后续 artifacts 与最终归档都要对照本节。
    - Capabilities 列的每个能力路径必须与 specs 阶段实际创建的文件路径一致。
    - 增加 `## Exploration` 节，记录用户确认依据、决策分支状态与理由、术语表维护与按需 ADR；不可把建议和沉默写成确认，阻断未知必须在编码前解决。
    - 文档采用原地收敛维护（Living Document）：需求或决策更新时直接修改对应章节正文，不往文档顶部堆叠历史修订横幅或过程流水账；演进历史由 Git 提交记录承载。
  specs:
    - 规范正文使用简体中文，但 SHALL/MUST 等英文规范关键词必须保留，并在其两侧留空格。
    - 每个 `### Requirement:` 至少有一个 `#### Scenario:`，场景标题恰好四个井号。
    - 规范只写可观察行为，不写内部类名、函数名、库选型或逐步实现细节。
  design:
    - design.md 是必产 artifact，按变更复杂度调整篇幅，不得省略。
    - 涉及部署、数据迁移或回滚时必须写 `## Migration Plan`；Open Questions 只记录可安全延后的未知项。
    - 原地维护当前有效设计，删除已被取代的旧方案段落，不堆叠过程补丁说明。
  plan:
    - 仅在变更获准进入实施准备时生成 `plan.md`；尚未开工的远期变更只保留 `proposal.md`、`specs/` 与 `design.md`，不预生成施工排期文件，也不参与跨变更联动重审。
    - 评估并行与写范围隔离：可并行的工作包使用独立工作区；存在写范围重叠的必须在 Merge Order 串行合入并声明集成重验项。角色职责引用 openspec/role/。
    - 结构完整性由 `node testing/suites/verify-suite.mjs --change <name>` 机器校验：必备章节非空、7 列 Work Packages 表、唯一 Main E2E YAML 块及 WP↔tasks 双向词元绑定。
    - 收敛为两道独立门禁：① 编码前门禁（`verify-suite.mjs --change <name>` 通过后，独立 reviewer 一次性合审方案与用例）；② 集成交付门禁（全部工作包及需入库的验收测试代码提交为单一本地分支 Git commit SHA 后，由独立 tester 与 reviewer 并行验收/检视）。中间子包实现与局部缺陷修复由主执行者/coder 闭环，不逐补丁拉起独立角色微审。
    - 原地维护当前有效计划与最终 `Verification Results` 摘要，不将日常微测日志堆入 `plan.md` 正文。
  tests:
    - 仅在变更进入编码前准备阶段时，由独立 tester（不继承 coder 对话）基于当前最新 `proposal/specs/design` 和真实代码树生成一份 `tests.md`。
    - 保留稳定用例 ID 和标题，每例正文只必填用例级别、操作步骤、预期结果；通过四列映射表声明增量 `specs/<capability>/spec.md` 的 `Requirement`/`Scenario` 覆盖，先跑通 `node testing/suites/verify-suite.mjs --change <name>` 再交 reviewer 编码前语义合审。
    - LX 仅用于 Harness 无法通过代码、命令、协议探针或浏览器验证、必须由人工判断的场景，并在步骤中写明原因及最小人工范围；无此类场景不生成 LX。缺环境、凭据或入口记受阻/未执行（not-run），不自动转 LX，也不以模型推断冒充执行证据。
    - LX 仅需用户回答通过/不通过，由 Agent 记录用例 ID、受测 commit SHA 和用户原始结论；未回复记待确认，不得代签。结果与原始日志存本地被忽略的 `testing/runs/`，不写进用例定义，仅将精简结果摘要写入 `plan.md`。
  tasks:
    - 仅在变更进入编码前准备阶段时生成 `tasks.md`。每个 `- [ ] X.Y` 必须在同一行写明完成判据（测试、命令、可观察行为或交付物），并按完整词元引用至少一个 `plan.md` 工作包 ID（如 `WP1`）；`plan.md` 每个工作包至少被一个真实 checkbox 引用，由 `verify-suite.mjs` 自动核验。
    - 每个任务组自带对应的单元测试与实现文档，不把测试和文档全部堆到最后一组。不要在正文放示例 checkbox。
    - 编码前门禁通过后方可实施业务代码；只有完成判据具备真实证据时才勾 `- [x]`。归档及归档后复核放在非 tracked 的 `## Workflow follow-up` 节。

# 操作层指引：apply / archive 时作为 operationGuidance 下发（不写进任何 artifact 文件）。
operations:
  apply:
    guidance:
      - 开工前确认 `node testing/suites/verify-suite.mjs --change <name>` 与 `npm run check:spec` 通过，且已完成编码前门禁（独立 reviewer 一次性确认方案与用例无阻断）；对尚未开工的其他远期变更保持需求态冻结，不做跨变更施工文件陪跑更新。
      - 子包开发与局部修复阶段使用定向检查（如 `cargo test <filter>`、前端单测）快速迭代；共享只读编译缓存或避免无写冲突时的全量目录复制，并行写 Rust 时再隔离 `CARGO_TARGET_DIR`。
      - Red Check 聚焦于产品缺陷修复与核心安全/协议/状态机不变量，免除测试运行器、夹具脚手架和纯文档结构的人工退化留证。
      - 用本地工作分支 Git commit SHA（`git rev-parse HEAD` 且受跟踪文件工作区干净）作为正式交接与审查的唯一版本快照，废除未提交工作区的百文件手工 SHA-256 清单、源码副本归档及由此衍生的 Gitleaks 尾扫循环。若 `tester` 需补充入库的自动化验收代码，在锁定集成 commit SHA 前先提交入分支。
      - 全部工作包集成并跑通项目完整检查入口（`npm run check`、`npm run build:rust`）后，针对同一集成 commit SHA 并行发起一次独立 tester 正式验收与独立 reviewer 交付检视；tester/reviewer 不继承 coder 开发对话。
      - 独立门禁发现的阻断问题按稳定 ID 修复并提交新 commit，仅对受影响范围与回归项做增量重测/复查并由原提出者关闭；未执行或受阻项如实记 `not-run`，不把证据不足写成通过。门禁通过后仅回填 `plan.md` 结果摘要、勾选 `tasks.md` 及执行同步归档的纯文档提交（`git diff <tested-sha>..HEAD` 无任何产品/测试代码与构建配置改动），直接继承原受测 commit 结论，无需二次复审。
      - 修改和提交前核对 `git status` 与 `git diff --check`，保护用户无关修改，不混入临时文件或 `testing/runs/` 本地运行产物。
  archive:
    guidance:
      - 归档前确认 tracked 任务完成、集成交付门禁通过、阻断问题闭环，增量 specs 已同步到 `openspec/specs/`，稳定用例已按单一主归属能力合并到 `testing/suites/<capability>/tests.md`（多变更修改同一能力时在 `Source definitions:` 追加归档来源路径，跨能力共用用例在主套件定义、他处仅按 ID 引用），并通过 `npm run check:spec` 与适用工程检查。
      - 归档在 PR 前完成（本地工作分支提交，最终经 PR squash 合并至 main），只移动变更目录并合并规范与长期套件；纯归档/结果回填提交在零代码改动前提下直接沿用受测集成 commit SHA 的验收与检视结论。
