# Artifact 规则：追加到对应 artifact 的 instructions 上，不改模板正文。
rules:
  proposal:
    - 必须在 `## Success Criteria` 节保留用户原始要求、硬约束、非目标与成功判据；后续 artifacts 与最终归档都要能对照它们。
    - Capabilities 列的每个能力路径必须与 specs 阶段实际创建的文件路径一致。
    - 增加 `## Exploration` 节，记录各轮用户确认依据、所有决策分支状态与理由、术语表维护或无变化复核、按需ADR；不可把建议和沉默写成确认，阻断未知必须在编码前解决。
  specs:
    - 规范正文使用简体中文，但 SHALL/MUST 等英文规范关键词必须保留，并在其两侧留空格。
    - 每个 `### Requirement:` 至少有一个 `#### Scenario:`，场景标题恰好四个井号。
    - 规范只写可观察行为，不写内部类名、函数名、库选型或逐步实现细节。
  design:
    - design.md 是必产 artifact，不得因变更规模省略。
    - 涉及部署、数据迁移或回滚时必须写 `## Migration Plan`；Open Questions 只记录可安全延后的未知项。
  plan:
    - 每次主动评估并行，能拆则在隔离工作区并行；串行部分说明依赖、冲突或工具限制，不绑定宿主/模型。角色职责引用 role 文件。
    - 工作包写范围不得重叠；确实重叠的必须在本文件的 Merge Order 里串行并声明后合入者需重跑的检查。plan必备节、工作包表与Main E2E一致性当前由reviewer人工核对；重新实现专项脚本后才可声明机器校验。
    - Main E2E只放一个yaml配置块，拒绝重复键、别名和错误类型。not-applicable的reason/basis必须为非空字符串，alternative_checks必须为非空字符串列表；required时这三字段须省略、null或对应类型的空值。
    - Project Verify 引用 tests.md 用例ID，安排执行者、环境、位置及证据；最后验证覆盖待提交集成结果，不复制用例。写清固定版本、报告范围与归档路径复核。
    - 必须记录独立方案/用例检视和交付检视；tester/reviewer无coder对话继承，输入足够且独立。问题ID、修复、重测/复查及结论可追溯，自查不能代签。
  tests:
    - LX仅用于Harness无法验证、必须由人实际操作或判断的场景，须在操作步骤中说明无法验证的具体原因及需人工介入的最小范围，不新增固定字段。Harness可通过代码、命令、协议探针、浏览器或其他工具验证的内容按L1–L6执行；已有同版本、同范围且环境符合要求的有效证据可复用，不要求用户重复手动验收。缺工具、环境、权限或尚未实现测试入口应记为受阻/未执行，不自动转为LX；不能假设Harness已执行或以模型推断代替执行证据。混合场景只将无法验证的部分划入LX；无此类场景时不生成LX用例。独立安全检视不因需要独立角色就自动要求用户执行。
    - 独立tester按模板生成一份tests.md，保留稳定用例ID和标题，每例正文只必填用例级别、操作步骤、预期结果；只列实际需要的级别，不强制逐级适用性表。需求关联和共用执行信息按组说明，前提、环境、工具、真实/模拟边界和清理等仅在影响执行或判断时补充，不重复填写固定字段。活动变更的裸 `specs/<capability>/spec.md` 只指本次增量，显式 `openspec/specs/<capability>/spec.md` 只指长期规范；长期suite的裸路径指长期规范，禁止跨目录补位。当前无专项结构校验脚本，文件存在性、Requirement/Scenario名称及正常、异常、取消和边界覆盖均由reviewer逐项核对，不得声称文件存在即已覆盖场景。skip_specs变更引用proposal.md的 `## Success Criteria` 条目。
    - L1/L2引用现有检查入口；验收场景由tester维护，coder可补开发单元测试不擅改预期；用例由reviewer在编码前检视。结果独立保存，不写进用例定义。用户确认用例仅需用户回答通过/不通过，由Agent记录用例ID、受测版本和用户原始结论，不要求用户填写技术报告或证据；未回复记待确认，不得代签，必需用例待确认不能视为验收通过。
  tasks:
    - 每个 `- [ ] X.Y` 必须在同一行内写明完成判据（测试、命令、可观察行为或交付物）。
    - 每个任务组必须自带它该有的测试与文档，不得把所有测试和文档堆到最后一组。
    - plan.md每个工作包至少被一个真实checkbox任务的正文引用；按完整ID匹配，WP1不能由WP10或WP1-extra满足。注释、代码围栏、标题和普通段落不计关联；每个真实任务至少引用一个声明工作包，且不得出现plan未覆盖的新工作。tasks不要放checkbox示例，引擎进度计数仍按其原规则，不用项目关联检查代替引擎进度。
    - coder单元测试随实现交付；独立tester测试实现和验收、reviewer检视各有任务与证据。先通过方案/用例检视才编码，失败和未验证不得勾完成。归档及归档后检查留在非tracked的Workflow follow-up，避免归档前置循环。

# 操作层指引：apply / archive 时作为 operationGuidance 下发（不写进任何 artifact 文件）。
operations:
  apply:
    guidance:
      - 开工前读取三角色职责、proposal Exploration、tests和plan，补齐全部schema前置并运行项目实际提供的适用检查；独立reviewer确认方案/用例通过，无写范围静默重叠，Verify可执行；tester/reviewer独立上下文，不可用则记录未完成。规划阶段允许缺下游产物不构成开工豁免。
      - 主动安排可并行包，明确基线、写范围、环境和隔离工作区，串行原因写入plan，不允许并行写同一工作区；交接用户要求与文件依据，不继承开发对话。
      - 可交付实际 diff、patch 或提交及可读报告；patch 合入先 git apply --check 再 git apply，提交合入核对范围与依赖。
      - 交付记录实际验证命令、结果、未执行检查和已知限制；确认产物交付完整后才清理本次拥有的临时工作区。
      - 并行 Rust 构建分别设置 CARGO_TARGET_DIR，避免争用。
      - 提交前检查实际差异、暂存范围和 git diff --check，不混入临时文件、生成目录或用户无关修改。
      - 直接实现无需绕行 patch；最终检查覆盖实际集成结果，不要求额外宿主、模型或私有会话地址。
      - 提交信息按 commitlint.config.mjs 校验，避免工具隐式改写索引或扩展提交范围。
      - 独立验收/检视和修复闭环后，先同步specs及长期能力用例，再归档并复核移动差异，之后走分支推送/PR/必需检查/squash合并，不直推main；PR阶段改代码需重新判断证据有效性。
      - 检查在具备依赖的工作区运行；最终执行项目实际提供的完整验证入口，前端有独立检查入口时还需执行该工程的真实检查；当前没有产品实现时，不虚设成功检查。
      - 固定同一提交或文件摘要后tester正式验收与reviewer交付检视可并行；同版本同范围CI证据可复用，角色记录逐例结果与问题ID，自查不能代替独立结论。
      - 修复可沿用原coder/tester/reviewer各自上下文，但需新版本重测复查；阻断问题由独立提出者复核关闭，必需失败/未执行不交付，不把证据不足写成通过。
      - 修改和合入前核对用户未提交改动，不覆盖或隐式纳入无关工作。
      - 只有 tracked task 且其完成判据有可读证据时才勾 `- [x]`；失败或受阻保持待办并说明。
  archive:
    guidance:
      - 归档前确认全部tracked任务有证据、独立测试和检视通过、阻断问题闭环，specs已同步到openspec/specs，长期用例按能力合并到testing/suites且保留稳定ID，项目实际适用检查全部通过；没有产品实现或检查入口时明确说明，不将未执行视为通过。
      - 归档只移动变更目录并合并增量规范，不得顺手改写被归档文件的历史内容。
      - 归档在PR前完成；移动后复核文件摘要与路径、运行受影响检查，最终证据覆盖实际集成结果。后续修正使用新变更/新记录，不悄改历史验收结论。
