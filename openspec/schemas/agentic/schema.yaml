name: agentic
version: 1
description: '`agentic` 工作流 - proposal → specs/design → plan → tasks → 并发实现与检视 → 主分支验收（E2E 由 e2e 项目开关决定）→ 归档'
artifacts:
  - id: proposal
    generates: proposal.md
    description: 变更动机、范围、能力与影响
    template: proposal.md
    instruction: |
      创建 proposal，说明为什么需要本次变更（WHY）。
      propose 阶段负责完成 proposal、适用 specs、design、plan 与 tasks，并在 tasks 生成后完成
      独立依赖声明审查和 workflow check --stage plan；两者对当前规划版本均 PASS 才能报告 propose 完成。
      规划审查的组织与证据登记按 tasks instruction 执行，不推迟到 apply 的资源准备之后。
      正文不超过 2 页，重点解释动机、范围、能力与影响；行为细节放入 specs，
      技术方案放入 design.md，协作安排放入 plan.md。
      按 templates/proposal.md 的字段填写，各字段要求见该模板注释。
      Intent and Constraints 必须保留可追溯的用户原始要求、硬约束、非目标、成功判据、决策边界与
      Agent 假设。已明确的用户选择直接引用，不重复求批准；只有新增且改变约定方向的取舍才澄清。
      specs/design 和最终验收都要对照原始意图，不能只核对 Agent 生成文档彼此一致。

      Capabilities 是 proposal 与 specs 阶段之间的契约，不只是功能摘要。
      填写前先检查现有规范，区分新增能力与已有能力的需求变化，避免重复创建能力。
      每个列出的能力都必须有对应的增量规范文件，名称和路径应保持一致。

      至少声明一项能力；仅当规范层面的行为不变（纯重构、工具或文档变更）时，
      才在该变更的 `.openspec.yaml` 中设置 `skip_specs: true` 以跳过规范。
      此时删除两类能力清单的占位项，说明跳过理由并引用既有行为契约。
      没有该标记时，校验会拒绝零增量的变更。不得为通过校验而编造需求。
      规范描述行为，因此行为不变时，不应仅为记录实现调整而修改规范。

      proposal 直接输入 specs 和 design：specs 根据能力清单与变更范围定义行为要求及验收场景，
      design 根据动机、范围与影响制定技术方案。二者共同收敛后作为 plan.md 的输入，再生成 tasks。
      skip_specs 时，plan.md 依据 proposal、design 及明确引用的既有行为契约生成。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 可观察行为与可验证场景
    template: spec.md
    instruction: |
      创建规范文件，定义系统应当做什么（WHAT）。规范是行为契约，不是实现计划。

      适合写入规范的内容：
      - 用户或下游系统依赖的可观察行为。
      - 输入、输出和错误条件。
      - 安全、隐私、可靠性和兼容性等外部约束。
      - 能通过测试或明确的验证步骤确认的场景。

      不应写入规范的内容：
      - 内部类名或函数名。
      - 库或框架选型。
      - 逐步实现细节。
      - 详细执行计划和测试脚本。
      技术方案放入 design.md，协作与验证安排放入 plan.md，具体任务放入 tasks.md；
      详细测试步骤、数据准备和脚本由测试 Agent 在 apply 中细化。

      快速判断：如果某项实现可以替换而不改变外部可见行为，它通常不属于规范。

      为 proposal 中的每项能力创建一个 `specs/<capability-path>/spec.md`。
      `<capability-path>` 是相对于 `specs/` 的能力目录，如 `user-auth` 或 `identity/user-auth`。
      - 新增能力：使用 proposal 声明的准确路径。
      - 修改已有能力：沿用 `openspec/specs/<capability-path>/` 下的原有路径，
        在本次变更的 `specs/<capability-path>/spec.md` 中写增量，不移动或重命名能力。
      保留完整路径及现有嵌套层级；不得重命名能力，也不得为扁平布局新增领域层级。
      新增路径段使用 kebab-case。
      若 `.openspec.yaml` 设置了 `skip_specs: true`，则不创建规范；
      否则 `npx --quiet --no-install openspec validate <change> --strict` 会拒绝零增量的变更，proposal 未列出能力时应先修正 proposal。
      `skip_specs: true` 仅适用于没有规范层面行为变化的变更。

      按变更的实际操作类型选择对应标题，保持拼写不变；未使用的标题不得出现：
      - `## ADDED Requirements`：新增需求。
      - `## MODIFIED Requirements`：行为变化，必须包含更新后的完整需求。
      - `## REMOVED Requirements`：必须包含 **Reason** 和 **Migration**。
      - `## RENAMED Requirements`：仅修改名称，格式如下：
        - FROM: `### Requirement: <原名称>`
        - TO: `### Requirement: <新名称>`

      ADDED/MODIFIED 中每个 `### Requirement: <名称>` 的正文必须使用 SHALL/MUST 表达规范性要求，
      不用 should/may；至少包含一个 `#### Scenario: <名称>`，
      以 **WHEN**/**THEN** 描述触发条件及可观察的预期结果，包含理解行为所需的前置状态。
      场景标题必须恰好使用四个井号。
      不要用三级标题或普通项目列表代替场景标题，否则场景可能无法被正确识别。
      中文正文也必须保留 SHALL/MUST 等英文规范关键词，并在其两侧留空格，
      例如“系统 SHALL 允许用户导出数据”。
      REMOVED 使用需求标题及 Reason/Migration，RENAMED 使用 FROM/TO 映射；
      这两类操作不要求补写 SHALL/MUST 正文或 Scenario。删除不适用的模板章节及占位内容。

      新增能力：以 `## Purpose` 开头，用 1-2 句话、至少 50 个字符说明用途。
      少于 50 个字符时，`npx --quiet --no-install openspec validate <change> --strict` 会报告内容过短；中文也应满足字符数要求。
      归档时会将其复制到新建的主规范；省略会留下
      `TBD ... Update Purpose after archive` 占位内容，需要手工补齐。
      已有能力：增量规范中的 Purpose 会被忽略，因此应省略；
      如需更新已有 Purpose（包括清理遗留 TBD 占位内容），直接编辑主规范。

      读取或编辑已有主规范时，一律使用
      `<planningHome.root>/openspec/specs/<capability-path>/spec.md`。
      从 `npx --quiet --no-install openspec instructions ... --json` 获取 `planningHome.root`，
      该字段已解析仓库或 store 的根目录；不得自行推断或改用仓库相对路径。
      无论 store 来自 `--store`、项目的 `store:` 配置还是全局默认 store，
      该字段都会指向实际存放变更的根目录；不使用 store 时则指向当前仓库。
      不要自行判断属于哪种情况，以返回字段为准。

      MODIFIED 操作步骤：
      1. 在 `<planningHome.root>/openspec/specs/<capability-path>/spec.md` 中找到已有需求。
      2. 复制整个需求块，从 `### Requirement:` 开始，包含其全部正文和场景。
      3. 粘贴到 `## MODIFIED Requirements` 下，再修改为新行为。
      4. 确认需求标题名称与原文一致（忽略空白差异）。

      仅替换部分内容会在归档时丢失细节。
      新增内容若不改变现有行为，应使用 ADDED。

      各增量的字段与写法示例见 templates/spec.md。

      规范应可验证：每个场景都是潜在的测试用例，条件与预期结果应具体、可观察。
      按需求覆盖正常、异常及边界行为；不在场景中编写驱动工具、测试数据准备或自动化脚本。
      与 design 并行编写后，在生成 plan.md 前共同收敛行为验收条件及接口、数据、环境契约。
      plan.md 记录需求与场景到工作包、验证范围及完成条件的映射，再生成 tasks；
      测试 Agent 据此细化用例和断言，reviewer 与最终验收据此核对实现符合性及测试覆盖。
      归档时将本次增量同步到主规范，保留未受影响的既有要求。
      明确必须覆盖的端到端需求/路径，其适用性与最终完整范围在 plan.md 中确定；
      不在本阶段要求详细自动化用例。后续需求/接口澄清同步相关文档、任务、测试及证据有效性。
    requires:
      - proposal

  - id: design
    generates: design.md
    description: 实现方案、决策与风险
    template: design.md
    instruction: |
      创建 design.md，说明如何实现变更（HOW）。
      design.md 是必产 artifact：不得因变更规模省略文件。
      以下情况需要展开设计：
      - 跨多个服务或模块的变更，或引入新的架构模式。
      - 新增外部依赖，或重大数据模型调整。
      - 涉及安全、性能或复杂迁移。
      - 存在需要在编码前通过技术决策消除的歧义。

      按 templates/design.md 的字段填写，每个字段的要求见该模板注释；涉及部署、数据迁移或
      回滚时补充 `## Migration Plan`。会影响规范、方案或任务拆分的问题必须先与用户解决；
      Open Questions 只记录可安全延后的未知项，不收纳尚未完成的必要决策，无则省略。

      聚焦架构和实现思路，不逐行描述代码。proposal 解释为什么做以及变更范围，
      specs 定义行为要求，design 解释如何实现以及技术决策背后的原因。
      工作包负责人、worktree、执行批次和检查命令放入 plan.md，具体任务放入 tasks.md。
      某节若只会复述 proposal 或已完成的 specs，应引用对应文档。
      与 specs 并行编写后，在生成 plan.md 前共同收敛行为要求及接口、数据和环境契约；
      plan.md 按模块边界、接口依赖和环境约束记录工作包拆分、集成与验证安排，再生成 tasks。
      实现 Agent 据此编码；测试 Agent 据接口、数据及环境约定实现测试，预期行为仍以 specs 为准
      （skip_specs 时使用明确引用的既有行为契约）；reviewer 和最终验收核对设计一致性及风险措施落实情况。
    requires:
      - proposal

  - id: plan
    generates: plan.md
    description: 工作包、依赖、并发批次、文件归属、合并方式与验证策略
    template: plan.md
    instruction: |
      创建 plan.md，将 specs 的行为要求和 design 的技术方案转为协作安排。
      `templates/`、`roles/` 与 `procedures/` 位于 `npx --quiet --no-install openspec schema which agentic --json`
      返回的 `schema.path` 下；使用本次指令返回的完整 `template`（文本模式为 `<template>...</template>`），
      缺失或截断时完整读取 templates/plan.md；无论模板来源，均完整读取所引用的角色指令或程序，按模板生成计划。
      specs/design 可并行，进入 plan 前共同核对，无影响拆包/验收的冲突；必要问题先澄清。
      skip_specs 写理由，依据 proposal、design 和明确引用的既有行为契约，不编造规范。
      唯一 Coverage Index 覆盖全部增量需求/场景（含删除/重命名）或 skip_specs 既有契约，字段/证据路径按模板，任务生成后补编号。
      每行声明负责单元、本单元贡献/候选检查，跨单元指定闭环单元/阶段；final 全量核对最终证据。
      User Deliverables 填可用产物、位置/版本、用法/配置、接收方、完成标准和授权前提；新增任务同步 tasks，交付不扩大授权。
      plan 只需确定 Main E2E mode；E2E Ownership and Cases / E2E Execution Waves 在 apply 由测试设计产出、main 汇总，最终执行前冻结。
      意图、硬约束、范围或成功判据变化须记录依据/用户决策来源，文件同步不等于获得授权。

      生成任务前确定以下协作判据：
      - 工作包：禁止依赖环，依赖标 code / contract / resource，落在单个 WP，不写“整批依赖整批”；
        共享文件按“可多写者、单一合并负责人”登记，不要求独占。
      - 独立 review 与测试：required 至少一个 Role: tester 的 TP；每个 WP 的 Reviewer 非空且不等于 Owner，
        tasks 至少一条引用该 WP 的独立 review 任务，不得自审。
      - 依赖声明审查（propose 收尾门禁）：plan.md 的 Dependency Declaration Review 必须由独立 reviewer 以
        `phase: plan`、`stage: plan` 核实（目标为当前 planningDigest，不针对代码 diff），
        并在 verification.md 的 `## Dependency Declaration Review` 表逐条记录 PASS、Reviewer（非任何 WP Owner）、
        `Review ID + Round`、绑定的 Plan Revision（当前 planningDigest）与可读报告；
        缺失、非 PASS 或契约变化后过期时，plan 阶段检查不通过，propose 不得报告完成，不得派发实现。
        planningDigest（plan-v2）绑定需求、设计、WP 职责/依赖/波次/写范围、资源/合并安排；这些语义变化才重审。
        执行者、worktree/报告路径、后填用例/执行分配不参与摘要，身份独立性和路径仍由机械门禁检查。
        contractDigest 绑定完整契约/最终证据；旧规划审查按原 contractDigest 检查，不换绑新摘要。
        新计划声明 Test Authoring Protocol: staged-v2，设计记录不算编写交付。
      - 独立验证：validator 常设，不可“不适用”；`## Independent Validation` 表保留
        Task / Target Revision / Assignment / Pass Condition / Report Path，字段非空，tasks 保留唯一 [validation]。
        全部单元合入后在最终主分支固定版本执行，Target Revision 填该版本，须早于 [e2e-owned] 完成。
      - 调度与交接：主 Agent 是唯一调度台，按就绪条件逐个开工，不按批次互等。
        能开工 = 依赖的就绪 + 依赖接口已冻结可读 + 运行态资源空闲 + 该工作包状态未开工；
        同单元 code 依赖须上游进入“已验收集成基线”，跨单元须上游合入主分支；contract/resource 按冻结/空闲判定。
        “已验收集成基线”= 固定提交 + 包含上游交付提交 + 必要 Project Verify/独立 review PASS + main 接收；
        仅 merger 产出集成提交不算就绪，WP 已验收不等于单元已合入，不得为启动下游提前标 merged。
        有几个能开工就开几个，受 openspec/agentic.yaml 的 dispatch.pool 按角色占用上限约束，满则等释放；
        空窗口不预建实例，不因其他包在跑而等待。
        计划里的 Execution Waves 仅静态登记每个 WP 的最早可开工层级与 Serialization Reason，
        用于识别“无理由串行”：写入范围重叠只要求登记、不构成串行理由；仅 code 依赖、未冻结契约与
        不可隔离资源才允许抬升层级。Reason 格式为“<码>: <证据路径>”，证据必填；
        理由码只有 code-dependency / contract-unfrozen / resource-exclusive / capacity，且各有声明前提，凭空写码不算数；
        resource-exclusive 要求该资源确实标为不可隔离且无隔离方案；capacity 要求池上限 < 2，或同最早层级同角色工作包数超过池上限
        （带宽/人手不足应调小 pool 并写 capacity，不得把带宽写成 resource-exclusive）。
        dispatch-queue.jsonl 记录未开工/编码中/检视中/修复中/待合入/已合入/受阻/已退役；同包同时最多一个实例，重复派发不合格。
        未交付崩溃、待合入/已合入包候选或主分支回归失败、上游变化、受阻恢复均可 --reopen --reason 到修复中；
        Attempt 连续递增，implementation / contract / environment / runtime 各计数、各上限 3，旧无 --retry-kind 调用计 implementation。
        blocked 释放窗口且可恢复；拆包/删包/改 ID 须 --state superseded --reason 退役已开工旧包，保留台账，
        同步删除 plan 的 Work Packages/Execution Waves 行与 tasks 的 [wp:…] 行（三处一起改）。
        存在可并发层级（同层同角色 >=2 且对应池容量 >=2）时，台账中这些已开工工作包的占用窗口至少有一对真实重叠；
        同层同时有 coder 与 tester 已开工时，还需至少一对跨角色重叠窗口（契约明确时编码与测试设计必须并行）。
        时间戳由 openspec-agentic dispatch 的 claim/transition 自动写入，实际串行必须留证。
        接口明确（冻结契约路径/版本可核对）时必须并行编码和测试设计；集成验证前交接全部已验收上游、核对版本包含关系。
        integrated 按依赖层级提前组合，不等全包完成才首次集成；上游变化重评传递下游。
      - 资源：独立 worktree 不等于运行隔离；共享资源须隔离/独占，无资源写依据。
        独占为互斥而非先后依赖：同层禁两包使用同一不可隔离资源，须拆层并记 resource-exclusive。
        provisioner 按 (WP, Attempt) 返回结构化 worktree、基线提交、认领执行者、开工前接收时间；
        main 校验后登记 verification 的 `## Worktree Handoff`，子角色不写权威文件，未登记不通过。
      - 合入：候选建在当前最新主分支上，逐个单元串行合入（只一个合入执行者）；
        Verify/review 按改动内容指纹复用，仅限干净 rebase 且上游未触及本工作包写入范围，
        E2E 一律重跑。每次 premerge PASS 由主 Agent 校验 merger 返回的结构化记录后，在 verification.md 的
        `## Premerge History` 留一行（交付单元、全部工作包、目标/候选提交、结果、receipt 路径）；final 逐个交付单元核对
        Merge History 的 Candidate 都有对应 PASS，且交付单元一致。
      - 目标：固定已核实的本地主分支 refs/heads/*，候选构建/合入前/最终验收核实同一目标；
        不默认 HEAD，准确引用或提交无法核实则 BLOCKED。
      - 交付单元：可混用模式；逐单元完成候选验证、基线复核、防竞态合入、实际一致性/必要回归后才处理下一单元，
        不夹带未就绪单元；基线变化重建候选、重评证据，无关实现可继续。

      独立交付不确定时选 integrated；合入 Agent 的创建/隔离/串行更新及本地合入条件见 apply instruction。
      就绪阶段复核计划，变化先更新计划/依赖。

      Verification Strategy 须覆盖各阶段检查；统一入口须核实实际子检查，未安装工具不能视为已接入。
      执行、隔离、证据复用与失败判定见 apply instruction；角色细则见对应 roles/ 文件。
      Main E2E mode 明确选 required/not-applicable（计划约定，非 OpenSpec CLI 原生配置）；依据项目类型/变更范围，
      不依环境准备难易，缺失/非法先补计划。required 按真实入口定覆盖，不用 API、单测或原生 mock 替代场景；
      无现成 E2E 须规划建设或可复现人工步骤。not-applicable 必填 reason/basis/alternative_checks，不因纯库/CLI 标签判不适用。
      每个 alternative_check ID 在 tasks 以 [ID] 声明，最终在 verification 的 `## Checks` 有 PASS/可读证据；
      `e2e check` 只核对 mode、三字段/降级批准，不核对替代检查原始结果。

      项目级开关决定默认档位：生成计划前运行 `npx --quiet --no-install openspec-agentic e2e --json`
      读取 `openspec/agentic.yaml` 的 `e2e`（未配置或未安装时按 enabled 为 true 处理）。
      enabled 为 true 时本变更的 mode 必须为 required；只有用户显式批准降级才可写 not-applicable，
      并在 downgrade_approval 记录批准原话、时间与来源，缺少该记录的计划无效，不得据此跳过 E2E。
      enabled 为 false 时按上述判据自行选择。command 非空时必须作为项目 E2E 入口写入
      E2E Execution Contract 并据此执行；为空时规划建设或可复现的人工步骤。

      最终 Main E2E 单入口：每轮一次 `e2e run --stage final`，`e2e.command` 内并行分片、汇总全结果，
      任一失败/约定用例零执行即非零退出；禁止按分片多次调用掩盖失败，最终一次完整覆盖 Main E2E ID。
      候选不执行/记录 E2E，合入前不核对 E2E 记录；额外中间测试属项目自有 CI，由项目定性质/责任人，不参与本门禁合入/验收。
      分片不超可用隔离资源，超出须串行/独占排队。

      本流程已约定本地合入：满足门禁和仓库规则后直接合入计划中的本地主分支，无须重复确认；
      回滚仍须另行授权。
      主 Agent 在 apply 内执行最终验收，按 procedures/acceptance.md 核对计划与证据，不等待用户另发命令。
    requires:
      - specs
      - design

  - id: tasks
    generates: tasks.md
    description: 包含验证方式的实现、测试、交付与验收任务清单
    template: tasks.md
    instruction: |
      创建任务清单，将实现工作拆分为可跟踪、可验证的步骤。
      `templates/`、`roles/` 与 `procedures/` 位于 `npx --quiet --no-install openspec schema which agentic --json`
      返回的 `schema.path` 下；使用本次指令返回的完整 `template`（文本模式为 `<template>...</template>`），
      缺失或截断时完整读取 templates/tasks.md，按 plan.md 的工作包、依赖层级与交付单元生成任务；
      分组/字段/逐行完成条件/复选框按模板，任务须一次会话内可完成，复制后更新编号/依赖引用。
      实现组每包一行，唯一 [wp:WPn] 与复选框同行，明细缩进不另开复选框；
      派发后先 `openspec-agentic dispatch --wp` 登记 coding，交付销毁 coder、同窗口新建 reviewer（reviewing），review PASS 才由 main 勾选。
      每个 WP/TP 独立触发检视，不等同层 coder/tester/reviewer；Execution Waves 不是整批屏障。
      不为未就绪包预建实例，不因其他包在跑而等待。
      分别跟踪实现、交付检查、独立 review、适用集成/候选验证、各次合入后主分支检查及最终验收；局部自检不替代独立门禁。
      契约明确须并行编码/测试设计，只有依赖实际代码/运行资源的步骤可等待，并在 plan 记 Serialization Reason/证据路径。
      Merge Unit 每单元一组，保留模式/全部 WP/TP，逐组完成候选验证、合入、主分支检查；
      不夹带未就绪单元，不全局等待无关包，资源准备只阻塞依赖它的任务。

      按 plan.md 的 Main E2E mode 选择模板路径。项目开关开启或缺省时，若缺少用户批准的
      downgrade_approval，不得生成 not-applicable 路径。required 时生成最终完整 E2E（单元级候选阶段不做 E2E）；
      最终每轮仅一次 `--stage final` 聚合执行，分片由项目命令内部完成，不得按分片多次调用。
      连续失败计入 `e2e.maxAttempts`；达到上限后停止自动重跑并交用户决策。
      required 的测试设计与编码并行；E2E ID 可在 apply 中补齐，用例基础检查若触发真实产品操作，
      也须按 E2E 执行协议记录。

      Final E2E 保留执行 → main 汇总覆盖/问题/清理 → 门禁三步；真实执行、返回逐分片/逐 ID 原始证据即交付，
      不以 `e2e check` PASS 完成执行任务，main 汇总后才运行门禁。
      两种 mode 保留唯一 `[e2e-owned]`，仅此行由 `openspec-agentic e2e check --change <name>` PASS 自动勾选、非 PASS 回退，main 禁手改。
      not-applicable 替代验证另列 main 任务，完成后核对不适用判据。除该行/正在执行的 `[final-verification]` 外，
      其他适用任务未完成则 BLOCKED；门禁不延后到归档。

      最终验收保留唯一 `[final-verification]` 行，由主 Agent 在 apply 内使用 agentic-verify 入口执行；
      /opsx:verify 也使用该入口。验收时仅该行自身可待办，其他未完成任务不能忽略；
      /opsx:archive 不列入任务，避免归档依赖自身完成。
      编写前核对 design 的 Open Questions，改变构建内容的问题先与用户解决，不把未明说的假设写入任务。
      不勾选未完成检查；apply 仅在完成条件/证据有效后勾选，FAIL/BLOCKED 待办，失效时重开受影响任务并保留历史。
      verification.md 从 propose 规划审查开始，由 main 按 templates/verification.md 建立 Target、Handoff Index、Dependency Declaration Review 等适用节，
      apply 继续记录执行证据；它不新增 schema artifact。
      propose 收尾按以下顺序执行，不把规划审查和首次 plan 检查放入 apply 的资源准备任务：
      1. 完成 proposal、适用 specs、design、plan、tasks 的共同收敛并固定当前规划版本。
      2. 运行 `npx --quiet --no-install openspec-agentic workflow check --change <name> --stage plan --json`
         获取当前 planningDigest 与 contractDigest 并修正结构错误；此时审查记录尚缺失导致非 PASS 不代表审查已完成。
      3. 运行 `npx --quiet --no-install openspec-agentic roles --json` 读取当前角色映射，按配置派发独立 reviewer；
         使用 fork_turns="none" 或等效最小新上下文，完整读取并传入 roles/_shared/role-report.md 与 roles/reviewer.md，
         以 Review Type: plan、phase: plan、stage: plan 审查当前 planningDigest，Reviewer 不得是任何 WP Owner。
         规划报告的 task_id 为 propose:<Review ID>，不把本阶段审查登记在 apply 资源任务下。
         main 接收可读报告、登记 Handoff Index/Dependency Declaration Review；摘要变化重审，不把实际 reviewer ID/Round 反写 plan。
         汇总本轮阻断项、修正并同步全部受影响规划文件，固定摘要后派发复核；格式错误由 main 修正、重跑机械检查。
         PASS 的非阻断项不要求清零；采纳会改摘要时合并为一次修订，不逐项改版复审。
      4. 再运行上述 workflow check --stage plan；独立审查与机械检查对当前 planningDigest 均 PASS 后，
         才报告 propose 完成、可以进入 apply。规划审查不依赖执行 worktree，资源创建留在 apply。
         通过后用 workflow snapshot --change <name> --output <版本化快照.json> 保存已批准规划基线；后续不覆盖该快照。
      契约调整后重新执行受影响规划的审查与 plan 检查；摘要未变且原审查仍有效时复用原 PASS。
      检查意图、覆盖引用、唯一门禁任务、WP 依赖类型、Execution Waves 和共享文件登记；缺失/冲突先修正再开始受影响实现。
      该检查只读；规则和分阶段字段见 procedures/workflow-check.md，完整样例见 procedures/minimal-change.md。
    requires:
      - specs
      - design
      - plan

# 投递保证：本段 instruction 在 CLI 返回 all_done 时不再下发（引擎改为归档提示），
# 因此凡是必须在 all_done 之后仍可见的规则不能只写在这里；其引擎侧兜底文本在目标项目的
# openspec/config.yaml（operations.apply.guidance），宿主级路由与刹车在项目 AGENTS.md。
# 模型解析契约的权威正文在本段，config.yaml 的 apply guidance 不重复。
apply:
  requires: [ proposal, specs, design, plan, tasks ]
  tracks: tasks.md
  instruction: |
    读取 proposal、适用 specs、design、plan.md 和 tasks.md。老变更缺少 plan 或最终验收任务时先补齐；
    需求或接口变化时同步更新契约、计划、任务和用例，重评受影响证据，不暂停无关工作。
    调度、契约修正和门禁返工按 procedures/scheduling.md 执行；每次收到交付立即处理该包的下一步，不整批等待。
    继续维护 propose 中已建立的权威 verification.md，保留规划审查报告和历史；首次派发前补齐
    Dispatch Reconciliation 等执行期适用节，不要等到 premerge/final 才发现缺表而被 BLOCKED。子 Agent 仅返回结构化 handoff。
    中断恢复以目标、dispatch-queue.jsonl 台账、Handoff Index 与未闭环项为准，不依赖会话记忆。
    每次开始或恢复 apply、契约调整后，先运行 `npx --quiet --no-install openspec-agentic workflow check --change <name> --stage plan --json`；
    开始或恢复时只确认 propose 门禁仍有效，当前摘要未变且原审查有效时复用 PASS，不重新派发规划 reviewer。
    缺失意图基线、覆盖索引或必要门禁任务时据实补齐；旧变更未完成规划门禁或契约摘要变化时，
    先按 tasks instruction 补做规划审查与 plan 检查，检查非 PASS 不准备受影响实现的执行 worktree、不派发受影响实现。

    每次启动主流程、切换或派发角色前，运行 `npx --quiet --no-install openspec-agentic roles --json`，
    重新读取 `openspec/agentic.yaml` 的 `roles` 映射，不得缓存或生成宿主专用 agent 定义。
    `@current` 继承当前实际模型（不是宿主模型名）；宿主支持继承时省略模型参数，否则传入当前实际模型；
    其他值原样传给宿主本次调用。main 已运行时不追溯换模，新值在下次主流程启动或宿主原生切换时生效。
    无法设置时先报告能力限制，不得声称配置生效。模型选择不改变角色职责、隔离或证据要求。

    派发时完整读取并传入共用 `roles/_shared/role-report.md` 与对应角色指令：`roles/coder.md`、`roles/merger.md`、`roles/tester.md`、
    `roles/validator.md`、`roles/reviewer.md` 或 `roles/scout.md`、`roles/provisioner.md`，显式传入固定版本的契约、目标、允许范围、命令和中立证据；
    不传无关私有对话、实现推理或自评。主 Agent 记录执行者、输入、隔离和版本，并维护 plan.md、tasks.md、
    verification.md；不得创建汇总私有报告的子 Agent。缺少角色指令或所需隔离能力时，相关任务为 BLOCKED。
    每个角色按共用契约逐任务返回 `handoff_index`；主 Agent 核对任务、固定版本、各 ID、可读报告、
    状态和适用依据，将每份索引的报告路径与行映射写入权威 verification.md。缺行、同次证据记录引用冲突、
    路径不可读或 INVALID/PENDING 时拒收相应 PASS，重开受影响任务并安排复验；不影响的工作继续。
    角色把结构化原始报告保存到持久路径，main 用 workflow record --change <name> --input <报告路径> 登记；
    --dry-run 可预览，命令拒绝枚举、语义键和摘要冲突，自动登记适用索引与原始报告哈希，不勾选任务。
    契约或检查变化后运行 workflow impact --change <name> --baseline <已批准快照.json>；
    仅 canContinue 中已开工且自身就绪条件仍满足的包继续，affected 等待修订与受影响证据复验；缺基线或不能映射时保守处理。
    不把局部继续编码等同于门禁 PASS，合入与最终验收仍要求完整当前门禁。
    主 Agent 还须核对全部 E2E ID 覆盖和跨角色引用，处理冲突并作整体结论；角色只报告自身范围。
    `roles/`、`templates/` 与 `procedures/` 位于 `npx --quiet --no-install openspec schema which agentic --json`
    返回的 schema 目录下；`templates/verification.md` 是结构模板，不生成同名产物。
    权威规划记录以 `npx --quiet --no-install openspec instructions ... --json` 返回的 changeDir 为准，主规范以
    planningHome.root 定位；子 Agent worktree 中的副本不作为权威记录。

    1. 按流水线与调用窗口调度工作包，不按批次互等：主 Agent 是唯一调度台，先用
       `openspec-agentic workflow status --change <变更> --json` 查看状态与优先准备队列（权威根分离时加 --planning-root）；
       按未完成下游数、最长依赖链、计划顺序优先处理可开工包，判据与保守边界见 procedures/scheduling.md。
       状态视图核对可选 Integration Baselines 接收记录，识别同单元已验收集成基线；
       无结构化记录时按原规则核实，不因视图保守提示等待而停工。状态视图不代替实际就绪核实或授权。
       逐个计算就绪的工作包
       （依赖就绪 + 接口已冻结可读 + 运行态资源空闲 + 状态未开工）并开工，有几个能开工就开几个，
       不超过 openspec/agentic.yaml 的 dispatch.pool 配置的流水线数量；空窗口不预建实例，也不因其他工作包在跑而等待。
       先选择依赖已满足且有对应流水线容量的工作包，再由 provisioner 仅为这些当前可开工包准备 worktree 和必要依赖；
       不预建全部后续工作包的 worktree，不等待其他包资源准备结束。交接接收后登记并实际派发，才能认领 coding/fixing；
       未首次认领的包保持 pending，在 tasks/verification 记录受阻原因；已认领而无法继续的包转 blocked，
       不用提前认领的台账表示排队意图。
       开工前用 `openspec-agentic dispatch --change <变更> --wp <WP> --executor <ID> --role coder|tester --require-ack`
       在 dispatch-queue.jsonl 登记状态（省略 --role 时按计划 Role 列推断，缺列按 Owner 规范化；不存在计划 Role 列时必须显式写 --role）；
       每个工作包在同一时刻最多一个实例，同一状态重复派发会被拒绝；
       按角色的占用达到 openspec/agentic.yaml 的 dispatch.pool 上限时拒绝开工（等窗口释放）。
       候选验证或主分支回归失败时用 `--reopen` 从检视中/待合入/已合入打回修复中（新的实现实例），
       重开用 --retry-kind implementation|contract|environment|runtime 及 --reason 明确原因，每类上限 3，Attempt 不重置；
       存在可并发层级时，台账里已开工工作包的占用窗口至少有一对真实重叠（串行执行必须留证）。
       作者及同窗口接管的 reviewer 收到任务后各自运行 dispatch --change <name> --wp <WP> --executor <实际 ID> --ack，
       持续执行时用 --heartbeat 报告进展；main 用 dispatch --change <name> --diagnose --idle-minutes 10 检查未接收或停滞。
       诊断不自动结束实例或释放窗口；确认受阻后 main 登记 blocked。旧台账未接收状态为 LEGACY_UNVERIFIED，不伪造历史确认。
       不得在运行时自行偏离计划：依赖或资源变化时回写计划并重过 workflow check --stage plan。
       实现使用独立分支/worktree；契约未冻结、code 依赖未满足、写入同一处或独占资源冲突的工作不得并行。
       集成前核对上游已验收提交在验证基线中；上游变化时重开受影响任务并复验。
       不预建 worker、不做“先起池子再认领”；被派发的工作包不再需要“宿主是否支持并发”的声明。
       无独立 reviewer 不得以自审替代。
       串行实现不代表具备完整交付能力：独立 reviewer、tester（required）及 merger 仍按角色规则要求，
       无法创建时只推进不依赖它们的工作，相关交付保持 BLOCKED。
       事实侦察由 scout 执行；资源准备、隔离与清理由 provisioner 执行；两者均使用
       fork_turns="none" 或等效最小新上下文；共享资源不能隔离时串行独占，并在异常后核实释放。
       资源操作按 plan.md 的资源表判定，不由执行者判断难易：表中登记为共享资源（端口、容器、
       数据库/schema、账号、缓存目录、外部服务）的分配、隔离、启动、就绪检查与清理一律由 provisioner 执行；
       工作包执行者只在已分配的隔离资源内启动、使用与清理自身资源（仅指未登记为共享、且已分配给该执行者的实例），
       不得连接其他实例或重置共享数据。
       表中登记为不可隔离的资源由 provisioner 按独占队列授权，同一层级不得并行派发。
       provisioner 为每个已开工工作包按 (WP, Attempt) 返回结构化 worktree 交接，主 Agent 校验后登记到
       verification.md 的 `## Worktree Handoff`（worktree、基线、本轮认领执行者、开工前接收时间；
       子角色不直接写权威文件）；未登记或与台账不一致不得继续。首次派发实现前，plan 阶段检查与
       `## Dependency Declaration Review` 必须已在 propose 对当前规划版本 PASS；apply 开始时确认有效后才准备执行 worktree。
       required E2E 的测试设计、编写和基础检查按 roles/tester.md 与编码并行；测试执行者隔离产品编码对话，
       有明确测试文件范围。tester 提交产物、main 确认可读且交接完整后即释放（不等 review PASS）；
       execute/retest 每轮独立派发新建实例（不是每条用例都新建），从当前主分支、用例/产物版本、
       本轮 E2E ID 与资源恢复上下文，retest 另附原问题 ID、失败证据、修复提交与 review 结论；
       每轮只允许一次聚合 E2E 入口调用。测试设计不等待产品或环境，只有依赖代码或资源的执行等待。

    2. 实现期间执行 Local Checks；交付前在固定提交执行计划内 Project Verify 和独立 Code Review，可并行。
       每个 WP/TP 的产物可读、交接完整后，立即释放该包作者实例，在同一流水线窗口派发新的独立 reviewer，
       并登记 reviewing；WP1 检视时 WP2 可继续编码、TP1 可继续编写或独立检视，不等待同层所有作者结束。
       每个包独立进入修复或待合入；只有交付单元所需依赖与最终验收才汇合，不以集中整理报告阻塞检视启动。
       Verify 逐项记录命令、版本、环境、退出码和日志；子检查失败、未发现测试或全跳过不能因最终退出码为零
       记为 PASS。未运行记 BLOCKED，实际失败记 FAIL；改动后复验受影响范围。
       仅当代码内容、命令/配置、环境、范围及身份依赖均不变时可复用有效证据，并记录原证据和适用依据。
       reviewer 每次使用新的隔离上下文（fork_turns="none"），完整读取 roles/reviewer.md，在固定 base/target
       或干净 worktree 检视实际 diff 与契约。其输入含 Review ID、范围、绝对路径、验证证据和版本；只读报告，
       不改代码或证据。未解决阻断项或报告不完整不得完成 review。探索性验证需要时按 roles/validator.md
       以同等隔离派发；它不替代普通命令或独立 review。

    3. 按 workflow status 的 mergeQueue/recommendedMerge 选择完整就绪单元，遵守计划 Order；
       同顺序组按下游解锁影响排序，实际合入仍逐单元串行完成门禁与回归。
       首次集成前派发独立 roles/merger.md Agent，传入计划、固定源提交、证据、本地目标分支、资源、合入条件
       和报告路径。它执行候选构建及符合条件的本地合入，不替代 reviewer、tester 或最终验收；每个目标
       分支只允许一个合入执行者串行更新。冲突交独立 review，契约取舍交主 Agent；本流程允许完成门禁后
       直接本地合入，不授权回滚、推送或发布。每个交付单元在最新主分支构造候选，完成候选 Project Verify 和差异 review 后才合入（候选阶段不执行 E2E）；
       主 Agent 将对应版本的 `agentic-premerge` 证据块写入 verification.md，在本单元复用的工作树（候选工作区）执行
       `openspec-agentic workflow check --change <name> --stage premerge --planning-root <权威规划根> --json`，非 PASS 不得合入。
       只在 PASS 之后，才把该块持久化为版本化 receipt，并在 `## Premerge History` 记一行
       （交付单元、该单元全部工作包、目标/候选提交、结果、receipt 路径），再合入。receipt 必须是合法的 agentic-premerge 块，
       其 candidate/target/contract_digest/requirements_digest/delivery_unit 与行及目标版本一致；final 逐行核对内容、证据摘要与结果。
       历史 receipt 只要求行为契约摘要（proposal+specs）仍成立：补写用例表、执行者、分片等执行安排不会使已合入单元的 receipt 失效。
       干净 rebase 且改动内容指纹未变时，Verify 与 review 报告可填 fingerprint 与 reused_from 复用原结论，
       E2E 一律重跑；指纹由检查工具从 git 计算，不接受自报。
       需求获用户授权调整时保留旧 receipt，用 Receipt Revalidations 关联失效历史、原摘要、授权与复验依据，
       指向覆盖原单元全部工作包、绑定当前需求且已合入的替代 receipt，不改写历史凭据。
       单元级候选阶段不做 E2E：该门只核对候选 Project Verify、独立 review 与主 Agent 的 Coverage Index 本单元贡献及候选证据；
       跨单元行在计划中指定闭环单元/阶段，final 核对全变更覆盖及最终运行证据。
       主分支移动时重建候选并重验。E2E 只在全部单元合入后执行一次。
       合入后立即完成主分支 Verify/review，再处理下一单元。目标变化时重建候选并复验；每次合入在 verification.md
       的 Merge History 登记一行（Target Ref / Merger / Candidate / Merged）；同一目标分支同一时刻只能有一个 Merger，
       身份更替按 verification 的 Merger Windows / Merger Takeovers 留前任释放、继任接收、固定目标版本和交接证据，
       核对窗口互斥；会话中断须确认已停止并释放，不能以超时推定释放。
       Candidate 必须是 Merged 的祖先且 Merged 必须在目标引用上（final/archive 机械校验）。
       independent 单元依次合入主分支；integrated 单元先汇总到变更集成基线并完成组合验证。两种模式都不得夹带未就绪单元。

    4. 按 plan 的 Main E2E mode 执行。required 时在全部交付单元合入后，对最终主分支实际构建/部署版本运行
       完整 E2E；本流程只在最终阶段执行 E2E，额外中间测试属项目自有 CI，不参与合入或验收判据。
       按 roles/tester.md 固定代码、用例、产物、配置和环境版本，
       覆盖全部 ID 并在真实入口断言；API/mock、启动成功、零退出码、跳过或截图都不等于通过。
       最终每轮只调用一次 `e2e run --stage final`，分片在 `e2e.command` 内并行并汇总；
       任一分片失败即非零退出，各分片独立留证。主 Agent 核对版本、ID 覆盖、隔离与原始证据。
       项目开关 enabled（缺省为 true）时若 plan.md 写 not-applicable 而无用户 downgrade_approval，
       计划无效：回写 required 并补齐任务，不执行替代路径；合法 not-applicable 须有 reason、basis
       与通过的非空 alternative_checks，E2E 记 NOT_APPLICABLE。
       required 的最终 E2E 在流程内通过 `npx --quiet --no-install openspec-agentic e2e run --change <name>`
       真实执行，标记 `--stage final`；测试 worktree 加 `--planning-root <权威规划根>`，
       输出、退出码及失败尝试均记录在权威变更目录。配置了项目命令时最终记录须与之相符；
       产品存在未提交改动时不得将执行记录视为有效；人工路径用
       `--manual --by <执行人> --evidence <证据引用> [--result pass|fail|blocked] [--cases <范围>]` 留证。
       执行者返回原始结果即交付；主 Agent 汇总覆盖、处理问题并清理后，运行
       `npx --quiet --no-install openspec-agentic e2e check --change <name>` 核对唯一 `[e2e-owned]` 门禁行。
       仅此行以 check PASS 为完成条件，由扩展自动勾选或回退，主 Agent 不得手改。
       check 要求其他任务已完成，仅该行与正在执行的 `[final-verification]` 可待办；无记录时可用
       `--run-if-missing` 先执行再判定。not-applicable 的替代验证由主 Agent 另列任务并先完成
       （任务带 [替代检查 ID] 标记，结果写入 verification.md 的 `## Checks`）；
       `e2e check` 只核对 mode、字段与降级批准，不核对每项替代检查的原始结果。
       E2E 连续失败达到 `e2e.maxAttempts`（默认 3）后停止自动重跑，保持门禁待办，
       将问题、尝试和证据交用户决策；不得修改记录绕过。失败/受阻暂停后续功能合入与归档，
       版本或环境变化时按原问题 ID 修复、review、复测，并重评受影响证据。
       暂停期间允许必要修复合入：按原问题 ID 通过 dispatch --reopen 重开原 WP（用例修复重开原 TP），
       新 attempt 使用新实例；复用原交付单元并新增 Merge ID，不覆盖旧历史。重开受影响实现/用例、review、
       本单元候选与合入/回归任务、独立验证、最终 E2E 执行/汇总及最终验收；[e2e-owned] 由 check 回退。
       修复交付 → 独立 review → 修复候选 Verify/差异 review/本单元覆盖及 premerge PASS → 合入 →
       主分支回归/差异复核 → 新一轮完整最终 E2E；候选仍不执行 E2E，既有失败与重试上限不清零。
       纯环境恢复不需代码合入，留就绪证据后按原问题 ID 复测；新增功能不得借修复继续推进。

    5. verification.md 使用 templates/verification.md，关联任务、Check、Review、测试报告、E2E 和问题 ID，
       并记录固定版本、命令/观察、结果、证据与复核。结果仅为 PASS / FAIL / BLOCKED / NOT_APPLICABLE；
       保存有效证据后才勾选任务。每完成一个工作包，运行 `openspec-agentic dispatch --change <变更> --wp <WP> --state <state>`
       更新工作包状态台账。并发判定以台账时间戳为准（时间戳由 dispatch 命令写入），不存在需要人工补录的窗口记录。
       Dispatch Reconciliation 按工作包对账：Attempt、Executor、State 必须与 dispatch-queue.jsonl 及 Handoff Index 一致；
       Review Findings 必须逐工作包记录（Work Package 列非空、Reviewer 不得是该 WP 的 Owner、CRITICAL/MAJOR 必须有 Resolution）；
       verification.md 的 `## Dependency Declaration Review`、`## Worktree Handoff`、`## Premerge History` 按模板逐行维护，
       缺失、回归或与台账/计划不一致时对账不通过。
       台账事件须带 version:1、at 可解析且不回退、attempt 每次加 1；退役旧工作包用 `--state superseded --reason`（拆分可写多个 --superseded-by）。
       每个工作包同一时刻最多一个实例，台账出现重复开工即不通过。存在可并发层级时，已开工工作包的占用窗口
       至少需有一对真实重叠，否则视为串行并阻断；该时间戳由 dispatch 命令写入，仍属主体自报（伪造成本高于手写窗口，但不是进程级观测）。
       final/archive 阶段要求对账表覆盖全部工作包且状态为 merged（工作包状态必须落盘），否则不通过；premerge 至少校验已填写的行。
       保留失败、重试和最终验收历史；代码、用例、产物、配置或环境变化时重开
       受影响任务，复用证据须说明差异分析和不受影响依据。
       失败后，代码/用例/脚本修复须经独立 review、重新集成和受影响复验；纯环境恢复须留就绪证据并重跑
       受影响检查。恢复前不得继续后续功能合入或归档。

    6. 其他适用任务完成后，主 Agent 在 apply 内主动执行最终验收；/opsx:verify 仅为手动核查、恢复或复验入口。
       按 AGENTS.md 使用 agentic-verify；宿主无 skill 发现能力时，定位并完整读取 procedures/acceptance.md。
       它核对需求、设计、计划、任务、实现和 verification.md，不能替代真实 Verify、Review 或 E2E。
       目标主分支版本无法核实、验收指令缺失或存在未闭环阻断项时为 BLOCKED。仅当所有适用检查通过，且
       required E2E 为 PASS，或 not-applicable 具备理由、依据、完整通过的替代验证以及（开关开启或缺省时）
       可追溯到用户的 downgrade_approval 批准记录时，才报告可执行 /opsx:archive；
       验收期间仅 tasks.md 的 `[final-verification]` 自身可保持待办，其他未完成任务仍阻断验收。
       验收前先确认最终 E2E 任务已按完成条件通过 `npx --quiet --no-install openspec-agentic e2e check --change <name>`
       （PASS，且执行记录对当前版本有效；E2E 执行任务以原始证据为完成条件，不以该检查为完成条件）；它只比对开关、plan.md 判据与执行记录，不读测试证据。
       该检查在 apply 内为验收依据，归档阶段只核对结论是否仍对当前目标版本有效，不新增关卡。
       保留 CLI 原始状态并单独报告 PASS/FAIL/BLOCKED，不自动归档。
       语义审计完成后按 templates/verification.md 保存当前 agentic-assessment；运行
       `npx --quiet --no-install openspec-agentic workflow check --change <name> --stage final --json`。
       该只读检查核对准确目标引用、契约与证据摘要、唯一任务标记及 E2E；非 PASS 不勾选最终验收。
       机械 PASS 不能替代上述语义审计；受控集成/归档入口仍须显式调用检查，CLI 不自动拦截上游命令。
       规划时明确 plan.md 的 User Deliverables：产物、位置/版本、安装/运行入口、配置与使用说明、接收方及完成标准。
       最终回复逐项交接，并分别说明本地合入、远端交付、部署/发布、归档的实际状态与受阻原因；
       可归档不等于已交付。新增交付约定不扩大操作授权，推送、部署和发布按已有用户授权执行。
