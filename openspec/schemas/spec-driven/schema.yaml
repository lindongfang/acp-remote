name: spec-driven
version: 1
description: "ACP Remote full delivery workflow - proposal → specs/design → tests → plan → tasks (mark .openspec.yaml x-deferred: true for frozen roadmap changes)"
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      NOTE ON ROADMAP CHANGES: If the user is only defining a future roadmap change that
      is NOT scheduled for implementation yet, keep `schema: spec-driven` and add
      `x-deferred: true` to `.openspec.yaml`, stopping after `proposal.md`, `specs/`, and
      `design.md`. When scheduled for implementation later, remove `x-deferred: true`
      and generate `tests.md`, `plan.md`, and `tasks.md` against the current codebase.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **Success Criteria**: The user's original request, hard constraints, non-goals,
        and numbered success criteria (e.g., `SC1`, `SC2`), kept verbatim. Required -
        later artifacts and the final archive are checked against this section.
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability>/spec.md`. Name each capability for a durable system behavior using a flat single-level kebab-case directory name (e.g., `user-auth`, never nested subdirectories). Choose a cohesive boundary that can own related requirements as the system evolves; avoid broad catch-all capabilities.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing flat capability name under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.
      - **Exploration**: Decision branches from exploration rounds with their status
        and evidence, terminology-maintenance review, and ADRs when needed. Required;
        never record suggestions or silence as confirmation, and resolve blocking
        unknowns before coding.

      IMPORTANT: The Capabilities section creates the contract between proposal and
      specs phases. Research existing specs before filling this in:
      run `openspec list --specs` for the project's capability inventory, then
      `openspec show "<spec-id>" --type spec --json --no-scenarios` for an overview and
      `openspec show "<spec-id>" --type spec` in full before deciding what changes.
      Reuse an existing capability's exact flat name instead of introducing a near-duplicate.

      Every change must either declare at least one capability (new or modified) or
      explicitly opt out via `skip_specs: true` in `.openspec.yaml` when no spec-level
      behavior changes (pure refactor, tooling, docs). Do not invent a requirement just
      to satisfy validation. Changes marked `x-deferred: true` MUST declare at least
      one capability and MUST NOT set `skip_specs: true` or `retire_capabilities: true`.

      Maintain `proposal.md` in place starting with `# <Title>` as a clean living document:
      update sections directly when decisions evolve instead of stacking historical revision
      banners at the top of the file or duplicating `##` headings. Keep it concise (1-2 pages).
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability>` MUST be a flat single-level kebab-case directory name under `specs/`
      (e.g., `specs/user-auth/spec.md`, never nested subdirectories):
      - New capabilities: use the exact name from the proposal at `specs/<capability>/spec.md`.
      - Modified capabilities: use the exact existing name from `openspec/specs/<capability>/`
        when creating the delta at `specs/<capability>/spec.md`. Confirm via `openspec list --specs`.

      Write the spec files one at a time, starting with the first capability that has no file,
      unless the user asks to revise an existing file. There must be at least one spec file
      unless `.openspec.yaml` sets `skip_specs: true`.

      Delta operations (use `##` headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description (<= 500 chars)
      - Use SHALL/MUST with spaces on both sides for normative requirements
      - Each scenario: `#### Scenario: <name>` (exactly 4 `#`) with WHEN/THEN format
      - Every requirement MUST have at least one scenario

      New capabilities only: start with `## Purpose` (50+ characters). Do NOT add `## Purpose`
      to a delta for an existing capability.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability>/spec.md`
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly

      NOTE: Do NOT run `openspec-sync-specs` to sync delta specs into `openspec/specs/`
      before archive; specs and durable test suites sync atomically at archive time.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details and contracts
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      `design.md` is mandatory for every change in this project. Scale detail to
      the change, but never skip it based on size. Resolve blocking decisions
      through the confirmed exploration before test planning or implementation.

      Sections:
      - **Context**: Current state and constraints needed to explain the approach. Reference `proposal.md` for motivation instead of restating it.
      - **Goals / Non-Goals**: Design-level boundaries.
      - **Decisions**: Key technical choices with rationale and alternatives considered.
        Cross-package protocol DTO, state-machine, or SQLite schema contracts belong in
        subsections here (or as drafts in `docs/implementation/`), never as ad-hoc
        top-level `.md` files in `openspec/changes/<name>/`.
      - **Risks / Trade-offs**: `[Risk] → Mitigation`
      - **Migration Plan**: Steps to deploy, data compatibility, rollback strategy (if applicable)
      - **Open Questions**: Unknowns that can safely be answered later without changing specs or approach. Omit if none.

      Maintain `design.md` in place starting with `# <Title>` as a clean living document:
      replace superseded sections directly instead of prepending patch banners. Never link
      to `.gitignore` paths (such as `testing/runs/`) with Markdown `[text](path)` syntax;
      use backticked plain paths instead.

      ROADMAP BOUNDARY: If `.openspec.yaml` sets `x-deferred: true`, stop after
      `proposal`, `specs`, and `design`; do NOT create `tests.md`, `plan.md`, or `tasks.md`.
    requires:
      - proposal

  - id: tests
    generates: tests.md
    description: Independent pre-code test cases and repeatable acceptance entries
    template: tests.md
    instruction: |
      Maintain `tester` independence from `coder` implementation (`openspec/role/tester.md`):
      - If your environment supports subagents (e.g., `invoke_subagent`), spawn an independent
        `tester` subagent (without inheriting any `coder` implementation dialogue) that reads
        `openspec/role/tester.md`, `openspec/config.yaml`, `proposal.md`, `specs/`, `design.md`,
        and the real codebase, and writes `tests.md` directly to `resolvedOutputPath`.
      - If your environment is single-session without subagent support, write `tests.md` in
        this planning-only session (no `coder` implementation dialogue exists yet) so that all
        six artifacts complete and `npm run check:spec` stays green. Implementation (`apply`)
        MUST then run in a NEW session after the independent `reviewer` Pre-code Gate; never
        author `tests.md` and implement product code in the same session.

      Keep stable case IDs and titles. Require only the test level (`- 用例级别：`),
      actionable steps (`- 操作步骤：`), and observable expected results (`- 预期结果：`)
      in each case. Include only needed L1-L6/LX levels.

      State requirement/scenario references in markdown 4-column mapping tables:
      - Standard changes: `| 当前增量路径 | Requirement | Scenario | 用例 |` using
        `specs/<capability>/spec.md` for delta specs (100% coverage of all ADDED/MODIFIED
        Requirements & Scenarios) and explicit `openspec/specs/<capability>/spec.md` for
        optional cross-capability regression references.
      - `skip_specs: true` changes: `| 来源文档 | 章节 | 成功判据 | 用例 |` with rows
        `| proposal.md | Success Criteria | SCn | <Case IDs> |`, covering 100% of every
        `SCn` declared in `proposal.md` `## Success Criteria`.
      - Standard non-exempt changes MUST use the canonical 4-column mapping table (do not
        use legacy 2-column tables). Ensure stable case IDs do not collide with other active
        changes or unrelated durable suites.

      Reserve LX strictly for scenarios the harness cannot verify through tools and
      that require human judgment. Missing tools, credentials, or test entries mean
      `not-run`, never automatic LX or model inference.

      Run `node testing/suites/verify-suite.mjs --change <name>` and `npm run check:spec`
      to validate case structure and 100% scenario coverage before the Pre-code Gate.
      Store raw run logs in ignored `testing/runs/<change>/` (referenced with backticked
      inline paths only, never Markdown links) and concise summaries in `plan.md`.
    requires:
      - specs
      - design

  - id: plan
    generates: plan.md
    description: Execution arrangement - work packages, isolation, merge order, verification
    template: plan.md
    instruction: |
      Maintain `plan.md` in place starting with `# Plan` (current valid state only; do not
      append daily micro-logs, duplicate `##` headings, or stack revision banners).

      Follow `openspec/config.yaml` rules:
      - **Execution Model**: execution method, baseline Git commit, isolation boundaries.
      - **Parallel Assessment**: identify independent work vs serialized overlap.
      - **Work Packages**: 7-column table (`ID | Goal / Scenarios | Dependencies | Agent | Write Scope | Deliverable | Verify`) with real repository paths.
      - **Merge Order**: integration order and re-verification for overlapping writes.
      - **Project Verify**: commands, working directories, and pass criteria referencing `tests.md` IDs.
      - **Code Review**: 6-column table (`Gate / Scope | Reviewer Agent | Review Focus | Pass Condition | Status | Reviewed Snapshot / Notes`) for the two-gate independent review model:
        1. Pre-code gate: one combined review of `proposal/specs/design/tests/plan/tasks` after `node testing/suites/verify-suite.mjs --change <name>` and `npm run check:spec` pass; set `Status` to `passed` and record the reviewed planning snapshot/reference in `plan.md` before coding starts.
        2. Integrated delivery gate: parallel independent `tester` acceptance and `reviewer` review bound to a single local-branch Git `commit SHA` (`HEAD` with clean tracked tree) after all implementation work packages (with implementation tasks checked off) and any tracked acceptance test code are committed. Post-gate pure-doc commits that record `Verification Results`, update `Code Review` `Status`, check off the gate task in `tasks.md`, fix relative link depth on archive, and archive inherit that tested commit's sign-off when `git diff <tested-sha>..HEAD` touches zero product/test code.
      - **Main E2E**: single typed `yaml` block (`mode: required` alone, or `mode: not-applicable` with `reason` in `pure-refactor | docs-only | no-user-surface | isolated-internal-module`, non-empty `basis`, and non-empty `alternative_checks` list).
      - **Risks**, **Handoff**, **Findings**, **Verification Results**: concise current state and integrated commit results (refer to `testing/runs/` with backticked inline paths only, never Markdown links).

      Validate structural rules automatically via `node testing/suites/verify-suite.mjs --change <name>`.
    requires:
      - specs
      - design
      - tests

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Maintain `tasks.md` cleanly starting with `# Tasks` without stacked top-level revision banners.

      Guidelines:
      - Group related tracked tasks under `##` numbered headings
      - Each tracked task MUST be a checkbox: `- [ ] X.Y WPn Task description and completion criteria`
      - Every real checkbox task MUST reference at least one declared Work Package ID
        from `plan.md` as a complete token (e.g., `WP1`), and every Work Package in
        `plan.md` MUST be referenced by at least one real checkbox task
      - State how to verify completion inline in each task's checkbox line
      - Each implementation task group MUST land the unit tests and documentation its own work calls for
      - Two-phase checkbox rule: check off implementation tasks (`1.x` etc.) once their unit tests
        and docs pass BEFORE committing the integrated `<tested-sha>`; keep the integrated gate
        task (e.g., `2.1`) unchecked in `<tested-sha>` and check it off in the post-gate pure-doc commit
      - Keep archive steps as plain bullets under `## Workflow follow-up` (NEVER use `- [ ]` or `- [x]` checkboxes here; sync `openspec/specs/` when applicable → move change to `openspec/changes/archive/` & adjust external relative links + `README.md`/`docs/` refs → merge `### <ID>` case bodies & chronologically ordered `Source definitions` into primary owner `testing/suites/<capability>/tests.md`, update `## 需求关联` and handle `REMOVED`/`retire_capabilities` cleanup → run `npm run check:spec`)
      - Run `node testing/suites/verify-suite.mjs --change <name>` and `npm run check:spec`
        to verify `plan.md ↔ tasks.md` bi-directional binding and 100% scenario coverage
    requires:
      - specs
      - design
      - plan
      - tests

apply:
  requires: [ tests, plan, tasks ]
  tracks: tasks.md
  instruction: |
    Ensure `.openspec.yaml` does NOT set `x-deferred: true`, `node testing/suites/verify-suite.mjs --change <name>` and `npm run check:spec` passed, and `plan.md` `## Code Review` marks the Pre-code Gate `Status` as `passed` before writing product code. Do NOT implement in the same session that authored `tests.md`; if `tests.md` was written in this session, stop and continue implementation in a new session. Implement tasks iteratively with targeted tests, check off completed implementation tasks (1.x), commit a clean integrated state on the local feature branch (leaving the integrated gate task unchecked and pausing there—config.yaml overrides default skill loops), run the parallel independent `tester` + `reviewer` gate on that commit SHA, and check off the gate task with `Verification Results` in the post-gate pure-doc commit.
