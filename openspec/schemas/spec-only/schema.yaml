name: spec-only
version: 1
description: ACP Remote roadmap / specification-freeze workflow - proposal → specs + design (promote to spec-driven before implementation)
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **Success Criteria**: The user's original request, hard constraints, non-goals,
        and numbered success criteria (e.g., `SC1`, `SC2`), kept verbatim. Required -
        later artifacts and the final archive are checked against this section.
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability>/spec.md`. Name each capability for a durable system behavior using a flat single-level kebab-case directory name (e.g., `user-auth`, never nested subdirectories). Choose a cohesive boundary that can own related requirements as the system evolves; avoid broad catch-all capabilities.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing flat capability name under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.
      - **Exploration**: Decision branches from exploration rounds with their status
        and evidence, terminology-maintenance review, and ADRs when needed. Required;
        never record suggestions or silence as confirmation, and resolve blocking
        unknowns before coding.

      IMPORTANT: Research existing specs before filling Capabilities:
      run `openspec list --specs` for the project's capability inventory, then
      `openspec show "<spec-id>" --type spec --json --no-scenarios` for overview and
      `openspec show "<spec-id>" --type spec` in full before deciding what changes.
      Reuse an existing capability's exact flat name instead of introducing a near-duplicate.

      Every `spec-only` roadmap change MUST declare at least one capability (new or modified);
      do NOT set `skip_specs: true` on `spec-only` changes (pure refactors, tooling, or docs
      changes with no spec-level behavior changes use `schema: spec-driven` with `skip_specs: true`
      when scheduled for implementation).

      Maintain `proposal.md` in place as a clean living document starting with `# <Title>`:
      update sections directly when decisions evolve instead of stacking historical revision
      banners at the top of the file. Keep it concise (1-2 pages).
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan. Include observable
      behavior, inputs/outputs/error conditions, external security/reliability constraints,
      and testable scenarios. Avoid internal class/function names, library choices, or
      step-by-step execution plans.

      Create one spec file per capability listed in the proposal's Capabilities section,
      using flat single-level kebab-case directory names (`specs/<capability>/spec.md`):
      - New capabilities: create `specs/<capability>/spec.md` with `## Purpose` (50+ characters)
        followed by `## ADDED Requirements`.
      - Modified capabilities: create `specs/<capability>/spec.md` matching `openspec/specs/<capability>/spec.md`
        without `## Purpose`. Under `## MODIFIED Requirements`, copy the ENTIRE existing
        requirement block from `<planningHome.root>/openspec/specs/<capability>/spec.md`
        and edit it in full so archive never loses scenarios.

      Delta operations (`##` headers): `ADDED Requirements`, `MODIFIED Requirements`,
      `REMOVED Requirements` (include **Reason** and **Migration**), `RENAMED Requirements`.

      Format requirements:
      - `### Requirement: <name>` followed by concise normative text (<= 500 chars) using `SHALL` / `MUST` with spaces on both sides
      - At least one `#### Scenario: <name>` (exactly 4 `#`) with `- **WHEN**` / `- **THEN**`
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with architectural decisions and contracts
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      `design.md` is mandatory for every change in this project. Scale detail to
      the change, but never skip it based on size.

      Sections:
      - **Context**: Current state and constraints needed to explain the approach.
      - **Goals / Non-Goals**: Design-level boundaries.
      - **Decisions**: Key technical choices with rationale and alternatives considered.
        Cross-package DTO, protocol, or SQLite schema contracts belong in subsections
        here (or in `docs/implementation/`), never as ad-hoc top-level `.md` files in
        the change directory.
      - **Risks / Trade-offs**: `[Risk] → Mitigation`.
      - **Migration Plan**: Steps to deploy, data compatibility, rollback strategy (if applicable).
      - **Open Questions**: Only unknowns that can safely wait until implementation preparation.

      Maintain `design.md` in place starting with `# <Title>`: replace superseded
      sections directly instead of prepending patch banners.

      ROADMAP BOUNDARY: `spec-only` changes stop after `proposal`, `specs`, and `design`.
      Do NOT create `tests.md`, `plan.md`, or `tasks.md` while `.openspec.yaml` is `schema: spec-only`.
    requires:
      - proposal

apply:
  requires: [ proposal, specs, design ]
  tracks: null
  instruction: |
    STOP — This change uses `schema: spec-only` (roadmap specification & design freeze only)
    and is NOT yet in pre-implementation preparation. Do NOT edit implementation code.
    When the user explicitly authorizes preparing this change for implementation:
    1. Update `.openspec.yaml` from `schema: spec-only` to `schema: spec-driven`.
    2. Delegate `tests.md` creation to an independent `tester` session (`openspec/role/tester.md`).
    3. Generate `plan.md` and `tasks.md` against the current codebase.
    4. Pass `node testing/suites/verify-suite.mjs --change <name>` and `npm run check:spec`.
    5. Complete the independent `reviewer` Pre-code Gate before writing product code.
